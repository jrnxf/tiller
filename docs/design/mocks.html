<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiller UI Mocks</title>
<style>
/* Geist and Geist Mono come from the board's bundled @fontsource-variable files (run bun install in board/ first), or from the installed fonts. No network. */
@font-face { font-family:"Geist"; font-weight:100 900; font-display:swap; src:local("Geist"), url("../../board/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2-variations"); }
@font-face { font-family:"Geist Mono"; font-weight:100 900; font-display:swap; src:local("Geist Mono"), url("../../board/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2-variations"); }
/* Tokens from tiller-design.html (copied from linear.app's shipped CSS). Light first, dark below. */
:root {
  --bg-0:#ffffff; --bg-1:#f8f8f8; --bg-2:#f4f4f4; --bg-3:#f0f0f0;
  --bg-sidebar:#f4f4f5; --bg-card:#ffffff; --bg-card-hover:#fbfbfb; --bg-panel:#ffffff; --bg-pop:#ffffff;
  --bg-hover:#0000000a; --bg-active:#00000010; --bg-cell:#00000005;
  --fg-1:#282a30; --fg-2:#3c4149; --fg-3:#6f6e77; --fg-4:#86848d;
  --line-1:#e9e8ea; --line-2:#e4e2e4; --line-3:#dcdbdd; --line-soft:#0000000d;
  --accent:#5e6ad2; --accent-hover:#6d78d8; --accent-tint:#f1f1ff; --accent-fg:#ffffff;
  --indigo:#5e6ad2; --green:#27a644; --yellow:#f0bf00; --orange:#fc7840; --red:#eb5757; --blue:#4ea7fc; --teal:#00b8cc;
  --todo:#b8b9bd;
  --shadow-low:0px 1px 4px -1px #00000017; --shadow-med:0px 3px 12px #00000017; --shadow-high:0px 7px 24px #0000000f;
  --shadow-stack:0px 8px 2px 0px #0000, 0px 5px 2px 0px #00000003, 0px 3px 2px 0px #0000000a, 0px 1px 1px 0px #00000012, 0px 0px 1px 0px #00000014;
  --r4:4px; --r6:6px; --r8:8px; --r12:12px; --r16:16px; --round:9999px;
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --w-normal:400; --w-medium:510; --w-semibold:590; --w-bold:680;
  --fs-micro:11px; --fs-mini:12px; --fs-small:13px; --fs-regular:15px; --fs-large:18px; --fs-t3:20px; --fs-t2:24px; --fs-t1:36px;
  --ease:cubic-bezier(.25,.46,.45,.94); --fast:.1s; --med:.18s;
  /* mock-only extensions: project hues and model hues (kept off the status colors) */
  --p-alpha:#12b5c6; --p-beta:#b36ae0; --p-dot:#d6a45c; --p-fleet:#7a97bd; --p-kiln:#e57a5b; --p-mesa:#e4739d; --p-orbit:#6fcf97; --p-quill:#c7b24a; --p-lumen:#8c8cf5;
  --m-opus:#9a7dff; --m-sonnet:#3f97f0; --m-haiku:#2fb98f;
  --orange-text:color-mix(in srgb, var(--orange) 66%, var(--fg-1)); --red-text:color-mix(in srgb, var(--red) 76%, var(--fg-1));
  --frame-h:clamp(720px, calc(100vh - 124px), 960px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-0:#08090a; --bg-1:#0f1011; --bg-2:#141516; --bg-3:#191a1b;
    --bg-sidebar:#08090a; --bg-card:#141516; --bg-card-hover:#191a1b; --bg-panel:#0f1011; --bg-pop:#191a1b;
    --bg-hover:#ffffff0d; --bg-active:#ffffff14; --bg-cell:#ffffff05;
    --fg-1:#f7f8f8; --fg-2:#d0d6e0; --fg-3:#8a8f98; --fg-4:#62666d;
    --line-1:#23252a; --line-2:#34343a; --line-3:#3e3e44; --line-soft:#ffffff0d;
    --accent:#7170ff; --accent-hover:#828fff; --accent-tint:#18182f; --accent-fg:#ffffff;
    --todo:#8a8f98;
    --shadow-low:0px 2px 4px #0000001a; --shadow-med:0px 4px 24px #0003; --shadow-high:0px 7px 32px #00000059;
    --m-opus:#b4a0ff; --m-sonnet:#6db4fb; --m-haiku:#58d3ad;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-0:#08090a; --bg-1:#0f1011; --bg-2:#141516; --bg-3:#191a1b;
  --bg-sidebar:#08090a; --bg-card:#141516; --bg-card-hover:#191a1b; --bg-panel:#0f1011; --bg-pop:#191a1b;
  --bg-hover:#ffffff0d; --bg-active:#ffffff14; --bg-cell:#ffffff05;
  --fg-1:#f7f8f8; --fg-2:#d0d6e0; --fg-3:#8a8f98; --fg-4:#62666d;
  --line-1:#23252a; --line-2:#34343a; --line-3:#3e3e44; --line-soft:#ffffff0d;
  --accent:#7170ff; --accent-hover:#828fff; --accent-tint:#18182f; --accent-fg:#ffffff;
  --todo:#8a8f98;
  --shadow-low:0px 2px 4px #0000001a; --shadow-med:0px 4px 24px #0003; --shadow-high:0px 7px 32px #00000059;
  --m-opus:#b4a0ff; --m-sonnet:#6db4fb; --m-haiku:#58d3ad;
  color-scheme: dark;
}

* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg-0); color:var(--fg-2); font-family:var(--font); font-size:15px; line-height:1.6;
  font-optical-sizing:auto; -webkit-font-smoothing:antialiased; }
body { overflow-x:hidden; }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--accent); text-decoration:none; } a:hover { color:var(--accent-hover); }
code, .mono { font-family:var(--mono); font-size:.86em; }
code { background:var(--bg-2); border:1px solid var(--line-1); border-radius:var(--r4); padding:0 4px; color:var(--fg-1); overflow-wrap:anywhere; }
::selection { background:color-mix(in lch, var(--indigo), transparent 64%); }
:focus-visible { outline:2px solid var(--indigo); outline-offset:2px; }
.muted { color:var(--fg-3); }
.pdot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--pc); flex:none; }
.tnum { font-variant-numeric:tabular-nums; }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
@keyframes spin { to { transform:rotate(360deg) } }
.pulse { animation:pulse 1.8s var(--ease) infinite; }
.spin { animation:spin 1.1s linear infinite; }
@media (prefers-reduced-motion: reduce) { .pulse, .spin { animation:none } * { transition-duration:0s !important } }

/* ---------- mock chrome (page level, not part of the app) ---------- */
.shell { max-width:1560px; margin:0 auto; padding:14px 16px 40px; }
.mh { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.mh-title { display:flex; align-items:center; gap:10px; min-width:0; flex:none; }
.mh-title .logo { width:24px; height:24px; border-radius:6px; background:linear-gradient(135deg,var(--indigo),var(--teal)); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:var(--w-bold); flex:none; }
.mh-title b { color:var(--fg-1); font-weight:var(--w-semibold); font-size:15px; }
.mh-title .sub { font-size:var(--fs-mini); color:var(--fg-3); }
.mh-ctl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex:none; }
.seg { display:inline-flex; padding:2px; border:1px solid var(--line-1); border-radius:var(--r8); background:var(--bg-1); }
.seg button { border:0; background:transparent; height:26px; padding:0 10px; border-radius:var(--r6); font-size:var(--fs-mini); font-weight:var(--w-medium); color:var(--fg-3); white-space:nowrap; }
.seg button:hover { color:var(--fg-1); }
.seg button[aria-pressed="true"] { background:var(--bg-card); color:var(--fg-1); box-shadow:var(--shadow-stack); }
.screens { display:flex; gap:4px; margin:0; flex:1 1 640px; min-width:0; padding:3px; border:1px solid var(--line-1); border-radius:var(--r8); background:var(--bg-1); overflow-x:auto; scrollbar-width:none; }
.screens::-webkit-scrollbar { display:none; }
.screens button { flex:1 0 auto; display:flex; align-items:center; justify-content:center; gap:8px; height:32px; padding:0 14px; border:0; background:transparent; border-radius:var(--r6); font-size:var(--fs-small); font-weight:var(--w-medium); color:var(--fg-3); white-space:nowrap; transition:color var(--fast) var(--ease), background var(--fast) var(--ease); }
.screens button:hover { color:var(--fg-1); }
.screens button .n { font-size:11px; color:var(--fg-4); font-variant-numeric:tabular-nums; }
.screens button[aria-selected="true"] { background:var(--bg-card); color:var(--fg-1); box-shadow:var(--shadow-stack); }
.screens button[aria-selected="true"] .n { color:var(--accent); }
.caption { display:flex; align-items:flex-start; gap:8px; margin:10px 2px 10px; font-size:var(--fs-small); color:var(--fg-3); min-height:20px; line-height:1.5; }
.caption .cap-tx { flex:1; min-width:0; }
.caption svg { width:14px; height:14px; margin-top:3px; flex:none; color:var(--fg-4); }
.caption b { color:var(--fg-1); font-weight:var(--w-medium); }
.foot-note { margin:12px 2px 0; font-size:var(--fs-mini); color:var(--fg-4); }

/* ---------- App frame ---------- */
.app { position:relative; display:grid; grid-template-columns:236px minmax(0,1fr); grid-template-rows:minmax(0,1fr); height:var(--frame-h); border:1px solid var(--line-1); border-radius:var(--r12);
  overflow:hidden; background:var(--bg-1); box-shadow:var(--shadow-high); font-size:var(--fs-small); line-height:1.4; }
.app { --row-h:38px; --card-pad:8px; --lane-h:30px; --nav-h:28px; --cell-gap:4px; }
.app[data-density="compact"] { --row-h:30px; --card-pad:6px; --lane-h:26px; --nav-h:26px; --cell-gap:3px; }

/* sidebar */
.side { background:var(--bg-sidebar); border-right:1px solid var(--line-1); display:flex; flex-direction:column; min-width:0; padding:10px 8px; gap:2px; overflow:auto; }
.ws { display:flex; align-items:center; gap:8px; padding:4px 6px 10px; }
.ws .logo { width:20px; height:20px; border-radius:5px; background:linear-gradient(135deg,var(--indigo),var(--teal)); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:var(--w-bold); }
.ws .name { font-weight:var(--w-semibold); color:var(--fg-1); flex:1; }
.ib { width:28px; height:28px; display:grid; place-items:center; border:0; background:transparent; border-radius:var(--r6); color:var(--fg-3); flex:none; padding:0; }
.ib:hover { background:var(--bg-hover); color:var(--fg-1); }
.ib svg { width:16px; height:16px; }
.search { display:flex; align-items:center; gap:8px; height:30px; margin:0 2px 8px; padding:0 8px; border:1px solid var(--line-1); border-radius:var(--r6); background:var(--bg-card); color:var(--fg-4); cursor:pointer; }
.search svg { width:14px; height:14px; } .search span { flex:1; text-align:left; }
.search:hover { border-color:var(--line-2); }
kbd { font-family:var(--font); font-size:11px; font-weight:var(--w-medium); color:var(--fg-3); border:1px solid var(--line-2); border-bottom-width:1.5px; border-radius:var(--r4); padding:0 4px; min-width:18px; height:18px; display:inline-grid; place-items:center; background:var(--bg-1); line-height:1; }
.nav { display:flex; align-items:center; gap:8px; height:var(--nav-h); padding:0 8px; border-radius:var(--r6); color:var(--fg-2); font-weight:var(--w-medium); cursor:pointer; border:0; background:transparent; width:100%; text-align:left; flex:none; }
.nav:hover { background:var(--bg-hover); color:var(--fg-1); }
.nav[aria-current="page"] { background:var(--bg-active); color:var(--fg-1); }
.nav svg { width:16px; height:16px; color:var(--fg-3); flex:none; }
.nav[aria-current="page"] svg { color:var(--fg-1); }
.nav .lbl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav .count { font-size:var(--fs-mini); color:var(--fg-3); font-variant-numeric:tabular-nums; }
.nav .badge { font-size:11px; font-weight:var(--w-semibold); color:var(--accent-fg); background:var(--accent); border-radius:var(--round); padding:0 6px; min-width:18px; height:16px; display:grid; place-items:center; }
.nav .badge.warn { background:var(--orange); color:#1a0e08; }
.side .grp { font-size:var(--fs-mini); font-weight:var(--w-medium); color:var(--fg-3); padding:14px 8px 6px; display:flex; align-items:center; gap:6px; }
.side .grp .sp { flex:1; }
.side .grp .lnk { border:0; background:transparent; padding:0; font-size:var(--fs-mini); color:var(--fg-3); }
.side .grp .lnk:hover { color:var(--fg-1); }

/* the view knob */
.knob { display:grid; grid-template-columns:1fr 1fr; gap:2px; margin:0 2px 6px; padding:2px; border:1px solid var(--line-2); border-radius:var(--r8); background:var(--bg-card); }
.knob button { height:26px; border:0; border-radius:var(--r6); background:transparent; color:var(--fg-3); font-size:var(--fs-mini); font-weight:var(--w-medium); display:flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; transition:background var(--fast) var(--ease), color var(--fast) var(--ease); }
.knob button svg { width:14px; height:14px; }
.knob button:hover { color:var(--fg-1); }
.knob button[aria-pressed="true"] { background:var(--accent-tint); color:var(--fg-1); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 50%, transparent); }
.knob button[aria-pressed="true"] svg { color:var(--accent); }
.prow { display:flex; align-items:center; gap:8px; height:var(--nav-h); padding:0 2px 0 8px; border-radius:var(--r6); color:var(--fg-2); font-weight:var(--w-medium); cursor:pointer; flex:none; }
.prow:hover { background:var(--bg-hover); }
.prow[aria-current="true"] { background:var(--bg-active); color:var(--fg-1); }
.prow .pdot { width:8px; height:8px; border-radius:50%; background:var(--pc); flex:none; }
.prow .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.prow .pct { font-size:var(--fs-mini); color:var(--fg-3); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:5px; }
.prow .pct i { width:6px; height:6px; border-radius:50%; background:var(--orange); }
.prow .eye { width:24px; height:24px; border-radius:var(--r4); border:0; background:transparent; color:var(--fg-3); display:grid; place-items:center; padding:0; }
.prow .eye:hover { background:var(--bg-hover); color:var(--fg-1); }
.prow .eye svg { width:14px; height:14px; }
.prow .eye.sp { visibility:hidden; pointer-events:none; }
.prow[data-off="true"] .nm, .prow[data-off="true"] .pct { color:var(--fg-4); }
.prow[data-off="true"] .pdot { background:transparent; box-shadow:inset 0 0 0 1.5px var(--pc); opacity:.7; }
.prow[data-off="true"] .eye { color:var(--fg-4); }
.prow[data-dim="true"] .nm, .prow[data-dim="true"] .pct { color:var(--fg-4); }
.prow[data-dim="true"] .pdot { opacity:.55; }
.prow .chk { width:14px; height:14px; color:var(--accent); margin-right:5px; }
.knob-note { font-size:11.5px; color:var(--fg-4); padding:6px 8px 0; line-height:1.45; }
.live { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent); flex:none; }
.live.bad { background:var(--red); box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent); }
.live.warn { background:var(--yellow); box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 22%,transparent); }
.side .foot { margin-top:auto; padding:10px 8px 2px; font-size:var(--fs-mini); color:var(--fg-4); display:flex; align-items:center; gap:8px; flex:none; }
.side .foot svg { width:14px; height:14px; flex:none; }

/* main */
.main { position:relative; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg-1); }
.top { display:flex; align-items:center; gap:8px; height:44px; padding:0 12px 0 16px; border-bottom:1px solid var(--line-1); flex:none; }
.crumb { display:flex; align-items:center; gap:6px; color:var(--fg-3); font-weight:var(--w-medium); min-width:0; white-space:nowrap; overflow:hidden; }
.crumb b { color:var(--fg-1); font-weight:var(--w-medium); }
.crumb svg { width:14px; height:14px; flex:none; }
.crumb .pdot { width:8px; height:8px; border-radius:50%; background:var(--pc); flex:none; }
.crumb .cnt { font-size:var(--fs-mini); color:var(--fg-3); font-weight:var(--w-normal); }
.top .sp { flex:1; }
.menu-btn { display:none; }
.btn { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:var(--r6); border:1px solid var(--line-2); background:var(--bg-card);
  color:var(--fg-2); font-size:var(--fs-mini); font-weight:var(--w-medium); box-shadow:0 1px 1px #00000017; white-space:nowrap; transition:background var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.btn:hover { background:var(--bg-3); color:var(--fg-1); }
.btn svg { width:14px; height:14px; flex:none; }
.btn.primary { background:var(--accent); border-color:transparent; color:var(--accent-fg); }
.btn.primary:hover { background:var(--accent-hover); }
.btn.ghost { border-color:transparent; background:transparent; box-shadow:none; color:var(--fg-3); }
.btn.ghost:hover { background:var(--bg-hover); color:var(--fg-1); }
.btn.danger:hover { color:var(--red); }
.btn.sm { height:24px; padding:0 8px; }
.btn.lg { height:32px; padding:0 14px; font-size:var(--fs-small); }
.btn[disabled] { opacity:.45; pointer-events:none; }
.tabs { display:flex; align-items:center; gap:4px; height:38px; padding:0 12px 0 16px; border-bottom:1px solid var(--line-1); flex:none; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tabs .sp { flex:1; }
.tabs:empty { display:none; }
.tab { height:26px; padding:0 10px; border-radius:var(--r6); border:1px solid transparent; background:transparent; color:var(--fg-3); font-size:var(--fs-mini); font-weight:var(--w-medium); white-space:nowrap; flex:none; display:inline-flex; align-items:center; gap:6px; }
.tab:hover { color:var(--fg-1); }
.tab[aria-pressed="true"] { border-color:var(--line-2); background:var(--bg-card); color:var(--fg-1); }
.bseg { margin-right:6px; }
.bseg button { display:inline-flex; align-items:center; gap:6px; }
.bseg .tc, .tab .tc { font-size:11px; color:var(--fg-4); font-variant-numeric:tabular-nums; }
.view { flex:1; min-height:0; overflow:auto; position:relative; }

@media (min-width:821px) { #tabs[data-r="board"], #tabs[data-r="degraded"] { display:none; } }
/* chips */
.lab { display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 7px; border:1px solid var(--line-2); border-radius:var(--round); font-size:var(--fs-mini); color:var(--fg-2); font-weight:var(--w-medium); white-space:nowrap; flex:none; }
.lab .dot { width:7px; height:7px; border-radius:50%; flex:none; }
.lab svg { width:12px; height:12px; flex:none; }
.lab.ghost { border-style:dashed; color:var(--fg-3); }
.lab.sm { height:18px; padding:0 6px; font-size:11px; }
.lab.warn { color:var(--orange-text); border-color:color-mix(in srgb,var(--orange) 45%,var(--line-2)); background:color-mix(in srgb,var(--orange) 9%,transparent); }
.lab.yel { color:color-mix(in srgb,var(--yellow) 70%,var(--fg-1)); border-color:color-mix(in srgb,var(--yellow) 50%,var(--line-2)); background:color-mix(in srgb,var(--yellow) 10%,transparent); }
.lab.bad { color:var(--red-text); border-color:color-mix(in srgb,var(--red) 45%,var(--line-2)); background:color-mix(in srgb,var(--red) 9%,transparent); }
.lab.ok { color:color-mix(in srgb,var(--green) 80%,var(--fg-1)); border-color:color-mix(in srgb,var(--green) 40%,var(--line-2)); background:color-mix(in srgb,var(--green) 9%,transparent); }
.lab.acc { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 40%,var(--line-2)); background:var(--accent-tint); }
.lab.mute { color:var(--fg-3); }
.mchip { display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:var(--r4); font-size:11.5px; font-weight:var(--w-medium); letter-spacing:.005em; white-space:nowrap; flex:none;
  color:color-mix(in srgb, var(--mc) 70%, var(--fg-1)); background:color-mix(in srgb, var(--mc) 14%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--mc) 26%, transparent); }
.mchip.opus { --mc:var(--m-opus); } .mchip.sonnet { --mc:var(--m-sonnet); } .mchip.haiku { --mc:var(--m-haiku); }
.si { width:14px; height:14px; flex:none; display:block; }
.meta { font-size:var(--fs-mini); color:var(--fg-3); white-space:nowrap; }
.pri { width:16px; height:16px; display:grid; place-items:center; border:1px solid var(--line-2); border-radius:var(--r4); flex:none; }
.pri svg { width:12px; height:12px; }
.av { width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:9px; font-weight:var(--w-bold); color:#fff; position:relative; flex:none; }
.av.lg { width:28px; height:28px; font-size:12px; }
.av i { position:absolute; right:-2px; bottom:-2px; width:9px; height:9px; border-radius:50%; border:2px solid var(--bg-card); }
.ld { width:7px; height:7px; border-radius:50%; flex:none; display:inline-block; }
.ld.live { background:var(--green); box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent); }
.ld.waiting { background:var(--orange); box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 22%,transparent); }
.ld.idle { background:var(--fg-4); }
.ld.stale { background:var(--yellow); box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 20%,transparent); }
.ld.unknown { background:transparent; box-shadow:inset 0 0 0 1.5px var(--fg-3); }
.ld.off { background:var(--red); box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 20%,transparent); }
.obs.old { color:color-mix(in srgb,var(--yellow) 70%,var(--fg-2)); }

/* ---------- needs strip ---------- */
.strip { display:flex; align-items:center; gap:8px; min-height:34px; padding:4px 12px 4px 16px; border-bottom:1px solid var(--line-1); flex:none; overflow-x:auto; scrollbar-width:none;
  background:color-mix(in srgb, var(--orange) 6%, var(--bg-1)); }
.strip::-webkit-scrollbar { display:none; }
.strip .st-h { display:flex; align-items:center; gap:7px; color:var(--fg-1); font-weight:var(--w-medium); white-space:nowrap; flex:none; margin-right:4px; }
.strip .st-h .n { min-width:18px; height:16px; padding:0 5px; border-radius:var(--round); background:var(--orange); color:#1a0e08; font-size:11px; font-weight:var(--w-semibold); display:grid; place-items:center; }
.strip .st-i { display:inline-flex; align-items:center; gap:7px; height:26px; padding:0 10px 0 8px; border:1px solid color-mix(in srgb,var(--orange) 28%,var(--line-2)); border-radius:var(--r6); background:var(--bg-card); color:var(--fg-2); font-size:var(--fs-mini); font-weight:var(--w-medium); white-space:nowrap; flex:none; max-width:340px; min-width:0; }
.strip .st-i:hover { border-color:color-mix(in srgb,var(--orange) 60%,var(--line-2)); color:var(--fg-1); }
.strip .st-i .pdot { width:7px; height:7px; border-radius:50%; background:var(--pc); flex:none; }
.strip .st-i .tx { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.strip .st-i .id { color:var(--fg-3); }
.strip .st-i .ag { color:var(--fg-4); font-weight:var(--w-normal); }
.strip .st-i svg { width:13px; height:13px; flex:none; }
.strip .st-i.perm svg { color:var(--orange); }
.strip .st-none { color:var(--fg-3); }
.strip .sp { flex:1; min-width:8px; }
.strip .st-all { flex:none; }

/* ---------- board ---------- */
.board { min-width:var(--minw,900px); padding:0 16px 20px; }
.bhead { position:sticky; top:0; z-index:3; display:grid; grid-template-columns:var(--cols); column-gap:8px; background:var(--bg-1); padding-top:2px; }
.colh { display:flex; align-items:center; gap:7px; height:30px; padding:0 6px; min-width:0; }
.colh .n { color:var(--fg-1); font-weight:var(--w-medium); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.colh .c { color:var(--fg-3); font-variant-numeric:tabular-nums; }
.colh.mini { padding:0 4px; justify-content:center; gap:5px; }
.colh.mini .n { display:none; }
.colh.mini .c { color:var(--fg-4); }
.lane { margin-top:2px; }
.lane + .lane { margin-top:0; }
.lane-h { display:flex; align-items:center; gap:8px; height:var(--lane-h); padding:0 6px; color:var(--fg-1); font-weight:var(--w-medium); cursor:pointer; user-select:none; border-radius:var(--r6); min-width:0; }
.lane-h:hover { background:var(--bg-hover); }
.lane-h .chev { width:12px; height:12px; color:var(--fg-3); transition:transform var(--med) var(--ease); flex:none; }
.lane[data-open="false"] .lane-h .chev { transform:rotate(-90deg); }
.lane-h .pdot { width:9px; height:9px; border-radius:50%; background:var(--pc); flex:none; }
.lane-h .nm { flex:none; }
.lane-h .c { color:var(--fg-3); font-weight:var(--w-normal); font-variant-numeric:tabular-nums; white-space:nowrap; }
.lane-h .sp { flex:1; min-width:4px; }
.lane-h .orch { display:flex; align-items:center; gap:7px; color:var(--fg-3); font-weight:var(--w-normal); font-size:var(--fs-mini); min-width:0; white-space:nowrap; overflow:hidden; }
.lane-h .orch .tx { overflow:hidden; text-overflow:ellipsis; }
.lane-h .host-t { display:inline-flex; align-items:center; gap:5px; color:var(--fg-3); font-weight:var(--w-normal); font-size:11.5px; border:1px solid var(--line-2); height:18px; padding:0 6px; border-radius:var(--r4); flex:none; }
.lane-h .host-t svg { width:11px; height:11px; }
.cc { display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 8px 0 6px; border-radius:var(--round); border:1px solid var(--line-2); font-size:var(--fs-mini); color:var(--fg-2); font-weight:var(--w-medium); font-variant-numeric:tabular-nums; flex:none; background:var(--bg-card); }
.cc svg { width:12px; height:12px; }
.cc.attn { border-color:color-mix(in srgb,var(--orange) 50%,var(--line-2)); color:var(--orange-text); }
.ccs { display:flex; gap:5px; flex:none; }
.lane-cells { display:grid; grid-template-columns:var(--cols); column-gap:8px; margin-bottom:2px; }
.lane[data-open="false"] .lane-cells, .lane[data-open="false"] .lane-note { display:none; }
.lane[data-open="true"] .lane-h .ccs { display:none; }
.cell { background:var(--bg-cell); border-radius:var(--r8); padding:3px; display:flex; flex-direction:column; gap:var(--cell-gap); min-height:44px; min-width:0; }
.cell.mini { padding:4px 2px; }
.cell-label { display:none; }
.card { background:var(--bg-card); border:1px solid var(--line-1); border-radius:var(--r8); padding:var(--card-pad) 10px; box-shadow:var(--shadow-low); cursor:pointer;
  transition:border-color var(--fast) var(--ease), background var(--fast) var(--ease); text-align:left; width:100%; display:flex; flex-direction:column; gap:4px; position:relative; min-width:0; }
.card:hover { border-color:var(--line-3); background:var(--bg-card-hover); }
.card[aria-selected="true"] { border-color:color-mix(in lch, var(--accent), transparent 40%); box-shadow:0 0 0 1px color-mix(in lch, var(--accent), transparent 60%); }
.card[data-attn="true"] { border-color:color-mix(in srgb,var(--orange) 38%,var(--line-1)); }
.card[data-attn="true"]::before { content:""; position:absolute; left:-1px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--orange); }
.card .c-top { display:flex; align-items:center; gap:7px; font-size:var(--fs-mini); color:var(--fg-3); min-height:18px; }
.card .c-top .id { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:var(--w-medium); }
.card .c-title { display:block; color:var(--fg-1); font-weight:var(--w-medium); line-height:1.38; }
.card .c-title span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-width:0; overflow-wrap:anywhere; }
.card.slim { gap:1px; padding:4px 10px; }
.card.slim .c-top { min-height:16px; }
.card.slim .c-title span { -webkit-line-clamp:1; }
.card.slim .c-title { color:var(--fg-2); }
.mini-card { width:100%; height:26px; border:1px solid var(--line-1); border-radius:var(--r6); background:var(--bg-card); color:var(--fg-3); font-size:11px; font-weight:var(--w-medium); font-variant-numeric:tabular-nums; padding:0; display:grid; place-items:center; }
.mini-card:hover { border-color:var(--line-3); color:var(--fg-1); }
.colh .ib.sm { width:22px; height:22px; margin-left:auto; }
.colh .ib.sm svg { width:12px; height:12px; }
button.colh { border:0; background:transparent; color:inherit; cursor:pointer; border-radius:var(--r6); }
button.colh:hover { background:var(--bg-hover); }
.card .c-chips { display:flex; align-items:center; flex-wrap:wrap; gap:4px 5px; }
.card .c-live { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--fg-3); min-width:0; white-space:nowrap; }
.card .c-live .obs, .card .c-live > span:not(.obs):last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.card.done .c-title { color:var(--fg-2); }
.card.dim { opacity:.62; border-style:dashed; box-shadow:none; }
.app[data-density="compact"] .card { gap:4px; }
.lane-note { display:flex; align-items:center; gap:10px; margin:2px 0 6px; padding:5px 10px; border:1px solid var(--line-2); border-radius:var(--r8); font-size:var(--fs-mini); color:var(--fg-2); }
.lane-note svg.nic { width:14px; height:14px; flex:none; }
.lane-note .tx { flex:1; min-width:0; }
.lane-note b { color:var(--fg-1); font-weight:var(--w-medium); }
.lane-note.warn { background:color-mix(in srgb,var(--yellow) 8%,var(--bg-1)); border-color:color-mix(in srgb,var(--yellow) 32%,var(--line-2)); }
.lane-note.warn svg.nic { color:var(--yellow); }
.lane-note.err { background:color-mix(in srgb,var(--red) 7%,var(--bg-1)); border-color:color-mix(in srgb,var(--red) 32%,var(--line-2)); }
.lane-note.err svg.nic { color:var(--red); }
.lane-empty { grid-column:1 / -1; display:flex; align-items:center; gap:16px; padding:10px 16px; border:1px dashed var(--line-3); border-radius:var(--r8); color:var(--fg-3); }
.lane-empty .tx { flex:1; min-width:0; }
.lane-empty b { display:block; color:var(--fg-1); font-weight:var(--w-semibold); margin-bottom:2px; }
.lane[data-state="stale"] .cell, .lane[data-state="disconnected"] .cell { background-image:repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--fg-4) 9%, transparent) 7px 8px); }
.lane[data-state="disconnected"] .lane-h .nm, .lane[data-state="stale"] .lane-h .nm { color:var(--fg-2); }

/* focus layout */


/* ---------- inbox ---------- */
.inbox { display:grid; grid-template-columns:372px minmax(0,1fr); height:100%; min-height:0; }
.in-list { border-right:1px solid var(--line-1); overflow:auto; min-height:0; }
.in-detail { overflow:auto; min-height:0; padding:24px 32px 48px; }
.in-detail .inner { max-width:780px; }
.ghead { display:flex; align-items:center; gap:8px; height:36px; padding:0 16px; background:var(--bg-2); border-bottom:1px solid var(--line-1); border-top:1px solid var(--line-1); color:var(--fg-1); font-weight:var(--w-medium); position:sticky; top:0; z-index:1; }
.ghead:first-child { border-top:0; }
.ghead svg { width:14px; height:14px; color:var(--fg-3); flex:none; }
.ghead .c { color:var(--fg-3); font-weight:var(--w-normal); }
.ghead .sp { flex:1; }
.ghead .why { font-size:11.5px; color:var(--fg-3); font-weight:var(--w-normal); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.ghead.perm { background:color-mix(in srgb,var(--orange) 7%,var(--bg-2)); }
.ghead.perm svg { color:var(--orange); }
.ghead.gone { cursor:pointer; user-select:none; }
.irow { display:flex; align-items:flex-start; gap:10px; width:100%; padding:11px 16px; border:0; border-bottom:1px solid var(--line-soft); background:transparent; text-align:left; cursor:pointer; min-height:var(--row-h); position:relative; }
.irow:hover { background:var(--bg-hover); }
.irow[aria-selected="true"] { background:var(--bg-active); }
.irow .un { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; margin-top:7px; }
.irow .un.r { background:transparent; }
.irow .ii { flex:none; margin-top:2px; }
.irow .ii.permic { width:14px; height:14px; border:1.5px solid var(--orange); border-radius:4px; display:grid; place-items:center; color:var(--orange); }
.irow .ii.permic svg { width:9px; height:9px; }
.irow .bd { flex:1; min-width:0; }
.irow .t { color:var(--fg-1); font-weight:var(--w-medium); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.irow .t.mono { font-family:var(--mono); font-size:12px; font-weight:var(--w-normal); }
.irow .s { display:flex; align-items:center; gap:6px; margin-top:5px; font-size:var(--fs-mini); color:var(--fg-3); flex-wrap:wrap; }
.irow .s .pdot { width:7px; height:7px; border-radius:50%; background:var(--pc); }
.irow.gone .t { color:var(--fg-3); font-weight:var(--w-normal); }
.irow.answered .t { color:var(--fg-3); }
.in-back { display:none; margin:0 0 14px; }
.d-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:var(--fs-mini); color:var(--fg-3); }
.d-meta .pdot { width:8px; height:8px; border-radius:50%; background:var(--pc); }
.d-meta .sep { color:var(--fg-4); }
.d-q { font-size:22px; line-height:1.28; letter-spacing:-.012em; font-weight:var(--w-semibold); color:var(--fg-1); margin:14px 0 8px; text-wrap:balance; }
.d-q code { font-size:.8em; }
.d-ctx { color:var(--fg-2); font-size:14px; line-height:1.55; margin:0 0 16px; }
.cur { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--r8); border:1px solid color-mix(in srgb,var(--green) 32%,var(--line-2)); background:color-mix(in srgb,var(--green) 7%,transparent); font-size:var(--fs-mini); color:var(--fg-2); margin:0 0 20px; }
.cur svg { width:14px; height:14px; color:var(--green); flex:none; }
.cur b { color:var(--fg-1); font-weight:var(--w-medium); }
.cur.old { border-color:var(--line-2); background:var(--bg-2); }
.cur.old svg { color:var(--fg-3); }
.cur.age { border-color:color-mix(in srgb,var(--yellow) 36%,var(--line-2)); background:color-mix(in srgb,var(--yellow) 8%,transparent); }
.cur.age svg { color:var(--yellow); }
.blk { margin:0 0 20px; }
.blk-h { font-size:var(--fs-mini); font-weight:var(--w-medium); color:var(--fg-3); margin:0 0 8px; display:flex; align-items:center; gap:6px; }
.blk-h .c { color:var(--fg-4); font-weight:var(--w-normal); }
.evi { border:1px solid var(--line-1); border-radius:var(--r8); background:var(--bg-card); overflow:hidden; }
.evi-row { display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border-bottom:1px solid var(--line-soft); font-size:var(--fs-small); color:var(--fg-2); line-height:1.45; }
.evi-row:last-child { border-bottom:0; }
.evi-row svg { width:14px; height:14px; color:var(--fg-3); flex:none; margin-top:2px; }
.evi-row .mono { color:var(--fg-3); overflow-wrap:anywhere; }
.rec { display:flex; gap:12px; padding:12px 14px; border-radius:var(--r8); border:1px solid color-mix(in srgb,var(--accent) 36%,var(--line-1)); background:var(--accent-tint); }
.rec .tx { min-width:0; font-size:var(--fs-small); color:var(--fg-2); line-height:1.5; }
.rec .tx b { color:var(--fg-1); font-weight:var(--w-semibold); }
.rec .tx .who { display:block; font-size:var(--fs-mini); color:var(--fg-3); margin-bottom:2px; }
.optrow { display:grid; grid-template-columns:18px minmax(0,1fr) auto; column-gap:12px; align-items:start; padding:10px 12px; border:1px solid var(--line-1); border-radius:var(--r8); background:var(--bg-card); margin:0 0 6px; cursor:pointer; transition:border-color var(--fast) var(--ease), background var(--fast) var(--ease); }
.optrow:hover { border-color:var(--line-3); }
.optrow input { accent-color:var(--accent); margin:2px 0 0; width:16px; height:16px; }
.optrow:has(input:checked) { border-color:color-mix(in srgb,var(--accent) 60%,var(--line-2)); background:color-mix(in srgb,var(--accent) 6%,var(--bg-card)); box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent); }
.optrow .ol { color:var(--fg-1); font-weight:var(--w-medium); line-height:1.4; }
.optrow .oc { grid-column:2 / 4; color:var(--fg-3); font-size:var(--fs-mini); line-height:1.5; margin-top:3px; }
.optrow .oc b { color:var(--fg-2); font-weight:var(--w-medium); }
.optrow.dis { opacity:.55; pointer-events:none; }
.acts { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.note-in { width:100%; height:34px; border:1px solid var(--line-2); border-radius:var(--r8); background:var(--bg-card); padding:0 12px; font-size:var(--fs-small); color:var(--fg-1); outline:none; margin-top:6px; }
.note-in:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in lch, var(--accent), transparent 80%); }
.note-in::placeholder { color:var(--fg-4); }
.pane-box { border:1px solid color-mix(in srgb,var(--orange) 32%,var(--line-2)); border-radius:var(--r8); background:var(--bg-0); overflow:hidden; }
.pane-box .pb-h { display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid var(--line-1); background:color-mix(in srgb,var(--orange) 7%,var(--bg-2)); font-size:var(--fs-mini); color:var(--fg-2); }
.pane-box .pb-h svg { width:13px; height:13px; color:var(--orange); }
.pane-box pre { margin:0; padding:12px 14px; font-family:var(--mono); font-size:12px; line-height:1.6; color:var(--fg-2); overflow:auto; white-space:pre; }
.pane-box pre .cmd { color:var(--fg-1); }
.pane-box pre .sel { color:var(--accent); }
.pane-box pre .dm { color:var(--fg-4); }
.receipt { border:1px solid var(--line-2); border-radius:var(--r8); background:var(--bg-card); padding:14px 16px; margin-top:12px; }
.receipt .rc-h { display:flex; align-items:center; gap:8px; color:var(--fg-1); font-weight:var(--w-medium); margin:0 0 12px; }
.receipt .rc-h .sp { flex:1; }
.rc-steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
.rs .rs-top { display:flex; align-items:center; gap:8px; }
.rs .rs-top::after { content:""; flex:1; height:2px; border-radius:2px; background:var(--line-2); margin-right:8px; }
.rs:last-child .rs-top::after { display:none; }
.rs .ic { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-3); display:grid; place-items:center; color:transparent; flex:none; }
.rs .ic svg { width:12px; height:12px; }
.rs.done .ic { background:var(--green); border-color:var(--green); color:#fff; }
.rs.done .rs-top::after { background:var(--green); }
.rs.active .ic { border-color:var(--accent); border-top-color:transparent; animation:spin .8s linear infinite; }
.rs .rt { margin-top:8px; padding-right:12px; }
.rs .rt b { display:block; color:var(--fg-1); font-weight:var(--w-medium); font-size:var(--fs-small); }
.rs.todo .rt b { color:var(--fg-4); }
.rs .rt small { display:block; color:var(--fg-3); font-size:var(--fs-mini); line-height:1.45; margin-top:1px; }
.rs.todo .rt small { color:var(--fg-4); }
.in-empty { display:grid; place-items:center; height:100%; color:var(--fg-3); text-align:center; padding:24px; }
.in-empty b { display:block; color:var(--fg-1); font-weight:var(--w-semibold); margin-bottom:4px; }

/* ---------- peek panel ---------- */
.peek { position:absolute; top:0; right:0; bottom:0; width:500px; max-width:100%; background:var(--bg-panel); border-left:1px solid var(--line-1); box-shadow:var(--shadow-high);
  display:flex; flex-direction:column; transform:translateX(102%); transition:transform var(--med) var(--ease); z-index:5; visibility:hidden; }
.peek.open { transform:none; visibility:visible; }
.peek .ph { display:flex; align-items:center; gap:6px; height:44px; padding:0 8px 0 16px; border-bottom:1px solid var(--line-1); flex:none; }
.peek .ph .crumb { flex:1; }
.peek .pb { flex:1; overflow:auto; padding:18px 20px 24px; }
.peek h4 { font-size:var(--fs-t3); line-height:1.3; letter-spacing:-.012em; font-weight:var(--w-semibold); color:var(--fg-1); margin:0 0 8px; text-wrap:balance; }
.peek .desc { color:var(--fg-2); font-size:14px; line-height:1.55; margin:0 0 14px; }
.props { display:grid; grid-template-columns:92px minmax(0,1fr); row-gap:6px; column-gap:12px; padding:12px 0; border-top:1px solid var(--line-1); border-bottom:1px solid var(--line-1); margin:0 0 18px; align-items:center; }
.props dt { color:var(--fg-3); font-size:var(--fs-mini); }
.props dd { margin:0; display:flex; align-items:center; gap:6px; color:var(--fg-1); min-width:0; overflow-wrap:anywhere; flex-wrap:wrap; }
.sect { margin:0 0 22px; }
.sect-h { display:flex; align-items:center; gap:8px; color:var(--fg-1); font-weight:var(--w-semibold); margin:0 0 10px; }
.sect-h .c { color:var(--fg-3); font-weight:var(--w-normal); font-size:var(--fs-mini); }
.sect-h .sp { flex:1; }
.tl { position:relative; }

.retire-box { border:1px solid color-mix(in srgb,var(--red) 36%,var(--line-2)); border-radius:var(--r8); padding:12px; margin:0 0 16px; background:color-mix(in srgb,var(--red) 5%,var(--bg-panel)); }

/* ---------- single-project board (knob set to Focus) ---------- */

.btn kbd { margin-left:2px; height:16px; min-width:16px; font-size:10.5px; }

/* ---------- memory page ---------- */

/* ---------- health ---------- */

.v-ic { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--green); color:#fff; flex:none; }

/* ---------- sidebar: machines and quota ---------- */

.mfilt { margin-left:auto; display:grid; color:var(--accent); }

.mh2 { display:flex; align-items:center; gap:8px; padding-left:15px; font-size:12px; color:var(--fg-3); min-width:0; }
.mh2.stale { color:color-mix(in srgb,var(--yellow) 62%,var(--fg-1)); }
.pips { display:inline-flex; gap:2px; flex:none; }
.pips i { width:8px; height:4px; border-radius:2px; background:var(--line-3); }
.pips i.on { background:var(--accent); }
.mach .tip { position:absolute; left:4px; right:4px; bottom:calc(100% + 6px); z-index:50; padding:10px 12px; background:var(--bg-pop); border:1px solid var(--line-2); border-radius:var(--r8); box-shadow:var(--shadow-high); font-size:12px; line-height:1.5; color:var(--fg-2); font-weight:var(--w-normal); opacity:0; visibility:hidden; transform:translateY(3px); transition:opacity var(--fast) var(--ease), transform var(--fast) var(--ease), visibility 0s linear var(--fast); pointer-events:none; }
.mach .tip b { display:block; margin-bottom:2px; color:var(--fg-1); font-weight:var(--w-medium); }
.mach .tip .tq { display:block; margin-top:6px; color:var(--fg-3); }
.mach:hover .tip, .mach:focus-visible .tip { opacity:1; visibility:visible; transform:none; transition-delay:.25s, .25s, .25s; }
.qfoot { margin-top:auto; flex:none; display:flex; flex-direction:column; gap:7px; width:100%; padding:10px; border:1px solid var(--line-1); border-radius:var(--r8); background:var(--bg-card); text-align:left; color:var(--fg-3); cursor:pointer; transition:border-color var(--fast) var(--ease), background var(--fast) var(--ease); }
.qfoot:hover { border-color:var(--line-3); background:var(--bg-card-hover); }
.qf-1 { display:flex; align-items:center; gap:8px; font-size:var(--fs-small); color:var(--fg-1); }
.qf-1 b { font-weight:var(--w-medium); }
.qf-2 { display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--fg-3); }
.qdot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--green); box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent); }
.qdot.warn { background:var(--yellow); box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 24%,transparent); }
.qdot.bad { background:var(--red); box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 24%,transparent); }
.qmeter { position:relative; display:block; height:4px; width:64px; border-radius:2px; background:var(--line-2); flex:none; }
.qmeter i { position:absolute; inset:0 auto 0 0; border-radius:2px; background:var(--accent); }
.qmeter u { position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; border-radius:1px; background:var(--fg-1); text-decoration:none; }
.qmeter.big { width:100%; height:8px; border-radius:4px; margin:14px 0 10px; }
.qmeter.big i { border-radius:4px; }
.qmeter.big u { top:-5px; bottom:-5px; }
.qmeter.sm { width:100%; height:5px; }
.qmeter.unk { background:repeating-linear-gradient(90deg, var(--line-3) 0 4px, transparent 4px 8px); }
.fchip { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 6px 0 8px; margin-left:6px; border:1px solid color-mix(in srgb,var(--accent) 42%,var(--line-2)); background:var(--accent-tint); color:var(--fg-1); border-radius:var(--round); font-size:12px; font-weight:var(--w-medium); flex:none; white-space:nowrap; }
.fchip svg { width:12px; height:12px; flex:none; }
.fchip svg:last-child { color:var(--fg-3); }
.fchip:hover svg:last-child { color:var(--fg-1); }

/* ---------- agents: open in herdr ---------- */
.agd-hint { margin:8px 0 16px; font-size:12px; line-height:1.55; color:var(--fg-3); }
.agd-hint code { font-size:11px; }
.agd-hint kbd { height:16px; min-width:16px; font-size:10.5px; vertical-align:1px; }

/* ---------- memory: one document per project ---------- */
.docs { display:grid; grid-template-columns:212px minmax(0,1fr) 264px; height:100%; min-height:0; }
.doc-list { border-right:1px solid var(--line-1); padding:12px 8px; overflow:auto; display:flex; flex-direction:column; gap:2px; min-height:0; }
.dl-h { font-size:12px; font-weight:var(--w-medium); color:var(--fg-3); padding:2px 8px 8px; }
.doc-li { display:flex; align-items:center; gap:8px; height:30px; padding:0 8px; border:0; border-radius:var(--r6); background:transparent; color:var(--fg-2); font-weight:var(--w-medium); text-align:left; width:100%; flex:none; }
.doc-li:hover { background:var(--bg-hover); color:var(--fg-1); }
.doc-li[aria-current="true"] { background:var(--bg-active); color:var(--fg-1); }
.doc-li svg { width:16px; height:16px; color:var(--fg-3); flex:none; }
.doc-li .pdot { width:8px; height:8px; margin:0 4px; }
.doc-li .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.doc-li .ln { font-size:12px; color:var(--fg-4); font-weight:var(--w-normal); font-variant-numeric:tabular-nums; }
.doc-li .sn { min-width:18px; height:16px; padding:0 5px; border-radius:var(--round); display:grid; place-items:center; font-size:11px; font-weight:var(--w-semibold); color:var(--accent-fg); background:var(--accent); }
.doc-main { overflow:auto; min-width:0; min-height:0; }
.doc { max-width:760px; margin:0 auto; padding:30px 40px 90px; }
.doc-h { margin:0 0 30px; }
.doc-ti { display:flex; align-items:center; gap:12px; }
.doc-ti h1 { margin:0; font-size:30px; line-height:1.15; letter-spacing:-.022em; font-weight:var(--w-semibold); color:var(--fg-1); }
.doc-ti .pdot { width:14px; height:14px; }
.doc-ti svg { width:22px; height:22px; color:var(--fg-3); }
.doc-sub { margin:10px 0 0; font-size:15px; line-height:1.5; color:var(--fg-2); }
.doc-sub b { color:var(--fg-1); font-weight:var(--w-medium); }
.doc-legend { display:flex; gap:12px; align-items:baseline; margin-top:16px; padding:10px 12px; border:1px solid var(--line-1); border-radius:var(--r8); background:var(--bg-2); font-size:12.5px; line-height:1.5; color:var(--fg-3); }
.doc-legend .lg-s { flex:none; }
.doc-sec { margin:0 0 28px; }
.doc-sec h2 { margin:0 0 8px; font-size:17px; line-height:1.3; letter-spacing:-.01em; font-weight:var(--w-semibold); color:var(--fg-1); }
.de { position:relative; display:flex; align-items:flex-start; gap:10px; padding:5px 8px 5px 6px; margin:0 -8px 0 -6px; border-radius:var(--r6); }
.de:not(.sug):hover { background:var(--bg-hover); }
.de-bu { width:14px; height:24px; display:grid; place-items:center; flex:none; }
.de-bu::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--fg-4); }
.de.sug .de-bu::before { display:none; }
.de-bu svg { width:14px; height:14px; color:var(--green); }
.de-body { flex:1; min-width:0; font-size:15px; line-height:1.55; color:var(--fg-1); }
.de-t { outline:none; border-radius:3px; overflow-wrap:anywhere; }
.de-t[contenteditable] { cursor:text; }
.de-t[contenteditable]:focus { background:var(--bg-card); box-shadow:0 0 0 3px var(--bg-card), 0 0 0 4px color-mix(in srgb,var(--accent) 55%,transparent); }
.de-t:empty::before { content:attr(data-ph); color:var(--fg-4); }
.de-p { margin-left:8px; font-size:12px; color:var(--fg-4); white-space:nowrap; }
.de-p .dsep { margin-right:0; }
.pcard { border:0; background:transparent; padding:0; color:inherit; font:inherit; text-decoration:underline dotted; text-underline-offset:2px; cursor:pointer; }
.pcard:hover { color:var(--fg-2); }
.de-x { opacity:0; width:24px; height:24px; margin-top:1px; display:grid; place-items:center; border:0; background:transparent; border-radius:var(--r6); color:var(--fg-4); flex:none; transition:opacity var(--fast) var(--ease); }
.de-x svg { width:14px; height:14px; }
.de:hover .de-x, .de:focus-within .de-x { opacity:1; }
.de-x:hover { background:var(--bg-3); color:var(--red-text); }
.de-why { margin-top:3px; font-size:12.5px; line-height:1.45; color:var(--fg-3); padding-right:148px; }
.de.sug { padding-bottom:8px; }
.de.sug.add .de-t.sg { background:color-mix(in srgb,var(--green) 15%,transparent); box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--green) 62%,transparent); padding:1px 3px; margin:-1px -3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.de-t ins { text-decoration:none; background:color-mix(in srgb,var(--green) 15%,transparent); box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--green) 62%,transparent); padding:0 2px; border-radius:2px; }
.de-t del { background:color-mix(in srgb,var(--red) 12%,transparent); color:var(--fg-3); text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--red) 70%,transparent); padding:0 2px; border-radius:2px; }
.doc-legend ins { text-decoration:none; background:color-mix(in srgb,var(--green) 15%,transparent); box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--green) 62%,transparent); padding:0 4px; border-radius:2px; color:var(--fg-1); }
.de.sug:focus { outline:none; }
.de.sug:focus-visible { box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent); }
.sugbar { position:absolute; right:6px; bottom:6px; z-index:3; display:inline-flex; align-items:center; gap:2px; padding:3px; background:var(--bg-pop); border:1px solid var(--line-2); border-radius:var(--r8); box-shadow:var(--shadow-med); opacity:0; pointer-events:none; transform:translateY(3px); transition:opacity var(--fast) var(--ease), transform var(--fast) var(--ease); }
.de.sug:hover .sugbar, .de.sug:focus-within .sugbar, .de.sug[data-active="true"] .sugbar { opacity:1; pointer-events:auto; transform:none; }
.sb { height:24px; padding:0 10px; border-radius:var(--r6); border:0; background:transparent; color:var(--fg-2); font-size:12px; font-weight:var(--w-medium); display:inline-flex; gap:5px; align-items:center; }
.sb svg { width:12px; height:12px; }
.sb:hover { background:var(--bg-hover); color:var(--fg-1); }
.sb.keep { background:var(--accent); color:var(--accent-fg); }
.sb.keep:hover { background:var(--accent-hover); }
.add-line { display:inline-flex; align-items:center; gap:6px; height:26px; margin:2px 0 0 -2px; padding:0 8px 0 6px; border:0; border-radius:var(--r6); background:transparent; color:var(--fg-4); font-size:12.5px; font-weight:var(--w-medium); }
.add-line svg { width:12px; height:12px; }
.add-line:hover { color:var(--fg-1); background:var(--bg-hover); }
.de-empty { margin:0 0 4px; font-size:13.5px; color:var(--fg-4); }
.doc-rail { border-left:1px solid var(--line-1); background:var(--bg-panel); overflow:auto; padding:16px 14px 20px; min-height:0; }
.rail-h { font-size:12px; font-weight:var(--w-medium); color:var(--fg-3); margin:0 0 6px; }
.chg { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:4px 8px; align-items:start; padding:11px 0; border-bottom:1px solid var(--line-soft); }
.chg-i { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:var(--bg-3); color:var(--fg-3); }
.chg-i svg { width:12px; height:12px; }
.chg-i.kept, .chg-i.added { color:color-mix(in srgb,var(--green) 80%,var(--fg-1)); background:color-mix(in srgb,var(--green) 14%,transparent); }
.chg-i.edit { color:var(--accent); background:var(--accent-tint); }
.chg-i.discard, .chg-i.remove { color:var(--red-text); background:color-mix(in srgb,var(--red) 12%,transparent); }
.chg-t { font-size:var(--fs-small); font-weight:var(--w-medium); color:var(--fg-1); line-height:20px; }
.chg-q { margin-top:2px; font-size:12.5px; line-height:1.45; color:var(--fg-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
.chg-m { margin-top:4px; font-size:11.5px; line-height:1.4; color:var(--fg-4); }
.undo { height:22px; padding:0 7px; border:1px solid var(--line-2); border-radius:var(--r6); background:var(--bg-card); color:var(--fg-3); font-size:12px; font-weight:var(--w-medium); display:inline-flex; gap:5px; align-items:center; margin-top:-1px; }
.undo svg { width:11px; height:11px; }
.undo:hover { background:var(--bg-3); color:var(--fg-1); }
.chg-none { margin:8px 0 0; font-size:12.5px; line-height:1.5; color:var(--fg-3); }

/* ---------- health: claude quota ---------- */
.quota { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:28px; padding:18px 20px; border:1px solid var(--line-1); border-radius:var(--r12); background:var(--bg-card); }
.q-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.q-title { font-size:15px; font-weight:var(--w-semibold); color:var(--fg-1); }
.q-state { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px 0 8px; border-radius:var(--round); font-size:12px; font-weight:var(--w-medium); color:color-mix(in srgb,var(--green) 78%,var(--fg-1)); background:color-mix(in srgb,var(--green) 12%,transparent); }
.q-state i { width:7px; height:7px; border-radius:50%; background:var(--green); }
.q-state.warn { color:color-mix(in srgb,var(--yellow) 66%,var(--fg-1)); background:color-mix(in srgb,var(--yellow) 14%,transparent); } .q-state.warn i { background:var(--yellow); }
.q-state.bad { color:var(--red-text); background:color-mix(in srgb,var(--red) 12%,transparent); } .q-state.bad i { background:var(--red); }
.q-line { margin:12px 0 0; font-size:16px; line-height:1.45; color:var(--fg-1); }
.q-line b { font-size:28px; line-height:1; letter-spacing:-.02em; font-weight:var(--w-semibold); margin-right:2px; font-variant-numeric:tabular-nums; }
.q-key { display:flex; gap:6px 18px; flex-wrap:wrap; font-size:12px; color:var(--fg-3); }
.q-key span { display:inline-flex; align-items:center; gap:7px; }
.q-key .k-fill { width:14px; height:6px; border-radius:3px; background:var(--accent); }
.q-key .k-tick { width:2px; height:12px; border-radius:1px; background:var(--fg-1); }
.q-side { border-left:1px solid var(--line-1); padding-left:28px; display:flex; flex-direction:column; gap:10px; }
.q-sh { font-size:12px; font-weight:var(--w-medium); color:var(--fg-3); }
.qo { display:grid; grid-template-columns:84px minmax(0,1fr) 78px; align-items:center; gap:12px; font-size:var(--fs-small); }
.qo-l { color:var(--fg-2); }
.qo-v { color:var(--fg-1); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.qo-v.muted { color:var(--fg-4); }
.q-facts { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
.sig footer { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; padding-top:10px; border-top:1px solid var(--line-1); font-size:12px; color:var(--fg-3); }
.sig footer b { color:var(--fg-1); font-weight:var(--w-medium); }
.spark .sp-axis { stroke:var(--line-2); stroke-width:1; }

/* ---------- banners ---------- */
.banner { display:flex; align-items:center; gap:10px; min-height:34px; padding:5px 16px; font-size:var(--fs-small); border-bottom:1px solid; flex:none; color:var(--fg-2); }
.banner svg.bic { width:16px; height:16px; flex:none; }
.banner .tx { flex:1; min-width:0; }
.banner b { color:var(--fg-1); font-weight:var(--w-medium); }
.banner.warn { background:color-mix(in srgb,var(--yellow) 10%,var(--bg-1)); border-color:color-mix(in srgb,var(--yellow) 30%,var(--line-1)); }
.banner.warn svg.bic { color:var(--yellow); }

/* ---------- empty / toast / palette ---------- */
.empty { display:grid; place-items:center; height:100%; color:var(--fg-3); text-align:center; padding:24px; }
.empty b { color:var(--fg-1); display:block; font-weight:var(--w-semibold); margin-bottom:4px; }
.empty .btn { margin-top:12px; }
.toast { position:absolute; left:16px; bottom:16px; z-index:20; max-width:min(520px, calc(100% - 32px)); background:var(--bg-pop); border:1px solid var(--line-2); border-radius:var(--r8); box-shadow:var(--shadow-high);
  padding:10px 12px; display:flex; gap:10px; align-items:flex-start; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity var(--med) var(--ease), transform var(--med) var(--ease); }
.toast.show { opacity:1; transform:none; }
.toast .t1 { color:var(--fg-1); font-weight:var(--w-medium); }
.toast .t2 { color:var(--fg-3); font-family:var(--mono); font-size:11.5px; margin-top:2px; overflow-wrap:anywhere; }
.toast svg { width:16px; height:16px; color:var(--green); flex:none; margin-top:1px; }
.scrim { position:absolute; inset:0; background:color-mix(in srgb, #000 35%, transparent); z-index:30; display:none; align-items:flex-start; justify-content:center; padding-top:90px; }
.scrim.open { display:flex; }
.pal { width:min(620px, calc(100% - 32px)); background:var(--bg-pop); border:1px solid var(--line-2); border-radius:var(--r12); box-shadow:var(--shadow-high); overflow:hidden; max-height:calc(100% - 120px); display:flex; flex-direction:column; }
.pal .ctx { padding:10px 14px 0; }
.pal .ctx:empty { display:none; }
.pal input { width:100%; border:0; outline:none; background:transparent; padding:12px 16px 14px; font-size:var(--fs-regular); color:var(--fg-1); border-bottom:1px solid var(--line-1); }
.pal input::placeholder { color:var(--fg-4); }
.pal .list { overflow:auto; padding:6px; }
.pal .gl { font-size:var(--fs-mini); color:var(--fg-3); padding:8px 10px 4px; font-weight:var(--w-medium); }
.pal .it { display:flex; align-items:center; gap:10px; height:36px; padding:0 10px; border-radius:var(--r6); color:var(--fg-1); cursor:pointer; width:100%; border:0; background:transparent; text-align:left; flex:none; }
.pal .it svg { width:16px; height:16px; color:var(--fg-3); flex:none; }
.pal .it .k { margin-left:auto; display:flex; gap:4px; }
.pal .it[aria-selected="true"], .pal .it:hover { background:var(--bg-active); }
.nav-scrim { display:none; }

/* ---------- responsive ---------- */
@media (max-width:1330px) {
  .screens { order:3; flex-basis:100%; }
  .mh-ctl { margin-left:auto; }
}
@media (max-width:1180px) {
  .inbox { grid-template-columns:320px minmax(0,1fr); }
  .in-detail { padding:20px 22px 40px; }
  .lane-h .orch .tx { display:none; }
  .agents { grid-template-columns:minmax(0,1fr) 340px; }
  .docs { grid-template-columns:196px minmax(0,1fr) 240px; }
  .doc { padding:26px 28px 80px; }
  .sigs { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:1000px) {
  .charts { grid-template-columns:minmax(0,1fr); }
}
@media (max-width:820px) {
  :root { --frame-h:clamp(640px, calc(100dvh - 150px), 900px); }
  .shell { padding:12px 12px 32px; }
  .mh-title .sub { display:none; }
  .mh { gap:10px; }
  .mh-title { order:1; flex:1; }
  .mh-ctl { display:contents; }
  #mh-pal { order:2; padding:0 8px; }
  #mh-pal .lbl, #mh-pal kbd { display:none; }
  .screens { order:3; flex:1 1 100%; -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent); mask-image:linear-gradient(90deg,#000 88%,transparent); }
  .mh-ctl .seg { order:4; }
  .screens button { padding:0 12px; }
  .app { grid-template-columns:minmax(0,1fr); }
  .side { position:absolute; inset:0 auto 0 0; width:272px; max-width:86%; z-index:40; transform:translateX(-102%); transition:transform var(--med) var(--ease); box-shadow:var(--shadow-high); visibility:hidden; }
  .app[data-nav="open"] .side { transform:none; visibility:visible; }
  .app[data-nav="open"] .nav-scrim { display:block; position:absolute; inset:0; z-index:35; background:color-mix(in srgb,#000 40%,transparent); }
  .menu-btn { display:grid; margin-left:-6px; }
  .top { padding:0 8px 0 10px; }
  .top .hide-sm { display:none; }
  .board { min-width:0; padding:0 12px 20px; }
  .bhead { display:none; }
  .lane-cells { display:block; margin-bottom:10px; }
  .cell { margin:0 0 6px; background:transparent; padding:0; min-height:0; }
  .cell[data-n="0"] { display:none; }
  .cell.mini .mini-card { width:auto; min-width:34px; padding:0 8px; }
  .cell.mini { flex-direction:row; flex-wrap:wrap; }
  .cell.mini .cell-label { width:100%; }
  .cell-label { display:flex; align-items:center; gap:7px; padding:8px 4px 6px; color:var(--fg-3); font-size:var(--fs-mini); font-weight:var(--w-medium); }
  .cell-label b { color:var(--fg-1); font-weight:var(--w-medium); }
  .lane-h .orch, .lane-h .host-t { display:none; }
  .lane-h .ccs { flex-wrap:nowrap; }
  .lane-empty { flex-direction:column; align-items:flex-start; }
  .strip { padding:6px 10px; }
  .strip .st-all, .strip .sp { display:none; }
  .docs { display:flex; flex-direction:column; height:100%; overflow:auto; }
  .doc-list { flex-direction:row; flex:none; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line-1); padding:8px 10px; gap:6px; scrollbar-width:none; }
  .dl-h { display:none; }
  .doc-li { width:auto; height:28px; border:1px solid var(--line-2); border-radius:var(--round); padding:0 10px; }
  .doc-li .nm { flex:none; }
  .doc-main { overflow:visible; flex:none; }
  .doc { padding:20px 14px 28px; }
  .doc-ti h1 { font-size:24px; }
  .doc-legend { flex-direction:column; gap:6px; }
  .sugbar { position:static; opacity:1; pointer-events:auto; transform:none; margin-top:8px; align-self:flex-start; }
  .de.sug { flex-wrap:wrap; }
  .de-why { padding-right:0; }
  .de-x { opacity:1; }
  .doc-rail { border-left:0; border-top:1px solid var(--line-1); overflow:visible; flex:none; }
  .quota { grid-template-columns:minmax(0,1fr); gap:18px; padding:14px; }
  .q-side { border-left:0; padding-left:0; border-top:1px solid var(--line-1); padding-top:14px; }
  .q-line b { font-size:24px; }
  .mach .tip { display:none; }
  .caption { flex-wrap:wrap; }
  .agents { display:block; height:100%; }
  .ag-list, .ag-detail { height:100%; }
  .agents[data-pane="detail"] .ag-list { display:none; }
  .agents[data-pane="list"] .ag-detail { display:none; }
  .ag-detail { border-left:0; }
  .ag-row { grid-template-columns:10px minmax(0,1fr); }
  .ag-row.nest { padding-left:28px; }
  .ag-r { grid-column:2; flex-direction:row; justify-content:space-between; align-items:center; margin-top:8px; }
  .ag-l1 { flex-wrap:wrap; row-gap:4px; }
  .ag-t { flex-basis:100%; white-space:normal; }
  .h-in { padding:14px 12px 28px; }
  .sigs { grid-template-columns:minmax(0,1fr); }
  .sig-read, .sig-facts { min-height:0; }
  .verdict { padding:14px; gap:12px; } .verdict h2 { font-size:20px; }
  .disc .meta { display:none; }
  .inbox { display:block; }
  .in-list { border-right:0; height:100%; }
  .in-detail { height:100%; padding:16px 14px 40px; }
  .inbox[data-pane="detail"] .in-list { display:none; }
  .inbox[data-pane="list"] .in-detail { display:none; }
  .in-back { display:inline-flex; }
  .d-q { font-size:19px; }
  .rc-steps { grid-template-columns:minmax(0,1fr); gap:10px; }
  .rs .rs-top::after { display:none; }
  .rs { display:flex; gap:10px; }
  .rs .rt { margin-top:0; }
  .peek { width:100%; }
  .banner { padding:8px 12px; align-items:flex-start; flex-wrap:wrap; }
  .banner .btn { margin-left:26px; }
  .evlog div { grid-template-columns:58px minmax(0,1fr); }
  .evlog .src { display:none; }
  .pal { max-height:calc(100% - 90px); }
  .scrim { padding-top:56px; }
}

function inlineDiff(a, b) {
  const x = a.split(" "), y = b.split(" "), n = x.length, m = y.length;
  const L = Array.from({ length:n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0, dels = [], ins = [];
  const flush = () => { if (dels.length) out.push(`<del>${esc(dels.join(" "))}</del>`); if (ins.length) out.push(`<ins>${esc(ins.join(" "))}</ins>`); dels = []; ins = []; };
  while (i < n && j < m) { if (x[i] === y[j]) { flush(); out.push(esc(x[i])); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) dels.push(x[i++]); else ins.push(y[j++]); }
  while (i < n) dels.push(x[i++]); while (j < m) ins.push(y[j++]); flush();
  return out.join(" ");
}

    if (e.fresh) { ENTRIES.splice(ENTRIES.indexOf(e), 1); el.closest(".de").remove(); } else el.textContent = e.text;
    return;
  }
  if (v !== e.text || e.fresh) {
    const before = e.fresh ? { state:"gone" } : { text:e.text, prov:e.prov };
    const wasFresh = e.fresh;
    e.text = v; e.prov = { note:"you", when:"just now" }; e.fresh = false;
    pushChange({ doc:e.doc, entry:e.id, kind:wasFresh ? "added" : "edit", from:wasFresh ? "added by you" : "edited by you", before });
    const p = el.parentElement.querySelector(".de-p"); if (p) p.outerHTML = provHTML(e);
    const rail = $("#doc-rail"); if (rail) rail.innerHTML = railInner(e.doc);
  }
}

function drawSpark(el) {
  const g = SIGNALS().find(x => x.id === el.dataset.spark); if (!g) return;
  const w = Math.max(140, Math.floor(el.clientWidth)), h = 64, pad = 6, top = 6, bot = 16;
  const vals = g.vals, n = vals.length;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = i => pad + (w - 2 * pad) * i / (n - 1);
  const y = v => top + (h - top - bot) * (1 - (v - lo) / span);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <line class="sp-axis" x1="${pad}" x2="${w - pad}" y1="${h - bot + 2}" y2="${h - bot + 2}"/>

}

function chartFrame(w, h, m) { return { w, h, l:m.l, r:w - m.r, t:m.t, b:h - m.b, pw:w - m.l - m.r, ph:h - m.t - m.b }; }

  if (S.machine) out.push({ g:"View", i:"i-close", t:"Clear the machine filter", run:() => { S.machine = null; render(); } });
  out.push({ g:"Go to", i:"i-pulse", t:"Claude quota (Health)", run:() => goScreen("health") });
  out.push({ g:"Appearance", i:"i-sun", t:"Toggle light and dark theme", k:["T"], run:() => setTheme(document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches) ? "light" : "dark") });
  out.push({ g:"Appearance", i:"i-display", t:"Toggle comfortable and compact density", run:() => setDensity(S.density === "compact" ? "comfortable" : "compact") });
  out.push({ g:"Create", i:"i-plus", t:"New card", k:["C"], run:() => toast("New card (mock)", "tiller card add <project> \"title\", then one line into that orchestrator's pane") });
  CARDS.forEach(c => out.push({ g:"Cards", i:c.st || colOf(c.col).icon, t:`${c.id}  ${c.title}`, hint:c.slug, run:() => { S.route = "board"; if (isFocus() && S.focus !== c.p) S.mode = "all"; S.peek = c.id; S._resetPeek = true; render(); } }));
  return out;
}
function renderPal() {
  const q = palInput.value.trim().toLowerCase();
  palShown = palItems().filter(x => q ? (x.t + " " + x.g + " " + (x.hint || "")).toLowerCase().includes(q) : x.g !== "Cards").slice(0, 40);
  palSel = Math.min(palSel, Math.max(palShown.length - 1, 0));
  let last = "", h = "";
  palShown.forEach((x, i) => {
    if (x.g !== last) { h += `<div class="gl">${esc(x.g)}</div>`; last = x.g; }
    h += `<button class="it" type="button" data-act="palrun" data-i="${i}" aria-selected="${i === palSel}">${ic(x.i, "")}<span>${esc(x.t)}</span><span class="k">${(x.k || []).map(k => `<kbd>${esc(k)}</kbd>`).join("")}</span></button>`;
  });
  palList.innerHTML = h || `<div class="gl">No matches</div>`;
  $("#pal-ctx").innerHTML = S.peek ? `<span class="lab">${esc(S.peek)}</span>` : "";
  const sel = palList.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block:"nearest" });
}
function openPal() { scrim.classList.add("open"); palInput.value = ""; palSel = 0; renderPal(); setTimeout(() => palInput.focus(), 0); }
function closePal() { scrim.classList.remove("open"); }
function runPal(i) { const x = palShown[i]; if (!x) return; closePal(); x.run(); }

/* ============ ACTIONS ============ */
function answer(id) {
  const i = inboxById(id), pick = S.picks[id] || i.rec.opt;
  S.picks[id] = pick; S.answered[id] = true; S.read[id] = true;
  S.rc[id] = { pick, step:1, t:[mockTime(true), "", ""] };
  render();
  setTimeout(() => { S.rc[id].step = 2; S.rc[id].t[1] = mockTime(true); render(); }, 1000);
  setTimeout(() => { S.rc[id].step = 3; S.rc[id].t[2] = mockTime(true); render(); toast("Done: " + (i.options.find(o => o.v === pick).l), "Recorded, delivered and acted on. The receipt stays on the item."); }, 2300);
}
function openPeek(id) { S.peek = id; S._resetPeek = true; render(); }
function agentKeys() { return agentGroups().flatMap(g => g.rows.map(r => r.key)); }
function jumpAgent(key) {
  const f = findAgent(key || S.agSel); if (!f) return;
  herdrToast({ remote:!!f.p.remote, cmd:herdrCmd(f.p, f.a) });
}
function setMode(v) {
  if (v === "focus") { S.mode = "focus"; if (!PROJECTS.some(p => p.id === S.focus)) S.focus = "alpha"; if (S.route === "degraded") S.route = "board"; }
  else S.mode = "all";
  render();
}
let entryN = 0;
function onAction(t, e) {
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case "route": S.route = t.dataset.r; S.peek = null; if (S.route === "agents") S.agPane = "list"; S.navOpen = false; $("#app").dataset.nav = "closed"; if (S.route === "inbox") S.inPane = "list"; return render();
    case "mode": return setMode(t.dataset.v);
    case "showall": S.mode = "all"; Object.keys(S.visible).forEach(k => S.visible[k] = true); return render();
    case "focusproj":
      if (!PROJECTS.some(p => p.id === id)) return toast("Demo project (mock)", "Only alpha, beta, dot and fleet are real in this mock.");
      S.mode = "focus"; S.focus = id; if (S.route === "degraded") S.route = "board"; S.peek = null; S.navOpen = false; $("#app").dataset.nav = "closed"; return render();
    case "toggleproj": {
      e.stopPropagation();
      const visibleN = projList().filter(p => S.visible[p.id] !== false).length;
      if (S.visible[id] !== false && visibleN <= 1) return toast("Keep one project visible", "Use Focus to look at a single project instead.");
      S.visible[id] = S.visible[id] === false;
      if (isFocus()) S.mode = "all";
      return render();
    }
    case "lane": S.collapsed[id] = !S.collapsed[id]; return render();
    case "donetoggle": { const k = isFocus() ? "focus" : "all"; S.doneCollapsed[k] = !S.doneCollapsed[k]; return render(); }
    case "btab": S.btab = t.dataset.v; return render();
    case "card": return openPeek(id);
    case "closepeek": S.peek = null; return render();
    case "jump": return openHerdr(id || S.peek);
    case "toast": return toast(t.dataset.t1, t.dataset.t2);
    case "compose": return toast("New card (mock)", "tiller card add <project> \"title\", then one line into that orchestrator's pane");
    case "palette": return openPal();
    case "navopen": S.navOpen = true; $("#app").dataset.nav = "open"; return;
    case "navclose": S.navOpen = false; $("#app").dataset.nav = "closed"; return;
    case "inboxopen": S.route = "inbox"; S.inSel = id; S.inPane = "detail"; S.read[id] = true; S.peek = null; S._resetDetail = true; return render();
    case "insel": S.inSel = id; S.inPane = "detail"; S.read[id] = true; S._resetDetail = true; return render();
    case "inback": S.inPane = "list"; return render();
    case "gonetoggle": S.goneOpen = !S.goneOpen; return render();
    case "answer": return answer(id);
    case "opencard": S.route = "board"; if (isFocus() && cardById(id) && S.focus !== cardById(id).p) S.mode = "all"; S.peek = id; S._resetPeek = true; return render();
    case "agsel": S.agSel = t.dataset.key; S.agPane = "detail"; S._resetAg = true; return render();
    case "agjump": e.stopPropagation(); return jumpAgent(t.dataset.key);
    case "agclose": case "agback": S.agPane = "list"; return render();
    case "healthnums": S.healthNums = !S.healthNums; return render();
    case "memdoc": S.memDoc = id; S._resetDoc = true; return render();
    case "sugkeep": keepSug(id); render(); return toast("Kept (mock)", "Added to the page. Undo is in Recent changes.");
    case "sugdiscard": discardSug(id); render(); return toast("Discarded (mock)", "The agent will not suggest it again for 30 days. Undo is in Recent changes.");
    case "entryrm": { const en = entryById(id); const before = snap(en); en.state = "gone"; pushChange({ doc:en.doc, entry:id, kind:"remove", from:"removed by you", before }); render(); return toast("Line removed (mock)", "Undo is in Recent changes."); }
    case "entryadd": { const en = { id:"n" + (++entryN), doc:t.dataset.doc, sec:+t.dataset.sec, state:"live", text:"", prov:{ note:"you", when:"just now" }, fresh:true }; ENTRIES.push(en); S._focusEntry = en.id; return render(); }
    case "chgundo": undoChange(id); render(); return toast("Undone (mock)", "The page is back to how it was before that change.");
    case "machine": S.machine = (!id || S.machine === id) ? null : id; S.navOpen = false; $("#app").dataset.nav = "closed"; return render();
    case "palrun": return runPal(+t.dataset.i);
  }
}

/* ============ THEME, DENSITY, EVENTS ============ */
function setTheme(v) {
  S.theme = v;
  if (v === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  $$("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === v)));
  try { localStorage.setItem("tiller-mock-theme", v); } catch (_) {}
}
function setDensity(v) {
  S.density = v; $("#app").dataset.density = v;
  $$("[data-density-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.densitySet === v)));
  try { localStorage.setItem("tiller-mock-density", v); } catch (_) {}
}
document.addEventListener("click", e => {
  const th = e.target.closest("[data-theme-set]"); if (th) return setTheme(th.dataset.themeSet);
  const de = e.target.closest("[data-density-set]"); if (de) return setDensity(de.dataset.densitySet);
  const sc = e.target.closest("[data-screen]"); if (sc) return goScreen(sc.dataset.screen);
  if (e.target.closest("#mh-pal")) return scrim.classList.contains("open") ? closePal() : openPal();
  if (e.target === scrim) return closePal();
  const t = e.target.closest("#app [data-act], #caption [data-act]"); if (t) onAction(t, e);
});
document.addEventListener("change", e => { const r = e.target.closest("[data-pick]"); if (r) S.picks[r.dataset.pick] = r.value; });
document.addEventListener("input", e => { if (e.target.id === "retire-reason") S.retireReason = e.target.value; });
palInput.addEventListener("input", () => { palSel = 0; renderPal(); });
palInput.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { palSel = Math.min(palSel + 1, palShown.length - 1); renderPal(); e.preventDefault(); }
  if (e.key === "ArrowUp") { palSel = Math.max(palSel - 1, 0); renderPal(); e.preventDefault(); }
  if (e.key === "Enter") { runPal(palSel); e.preventDefault(); }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); scrim.classList.contains("open") ? closePal() : openPal(); return; }
  if (e.key === "Escape") {
    if (scrim.classList.contains("open")) closePal();
    else if ($("#app").dataset.nav === "open") { S.navOpen = false; $("#app").dataset.nav = "closed"; }
    else if (S.peek) { S.peek = null; render(); }
    return;
  }
  const ae = document.activeElement;
  if ((e.key === "Enter" || e.key === " ") && ae && ae.matches && ae.matches('[role="button"][data-act]')) { e.preventDefault(); ae.click(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(ae.tagName) || ae.isContentEditable || scrim.classList.contains("open") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "v") setMode(isFocus() ? "all" : "focus");
  else if (k === "o" && S.route === "agents") jumpAgent();
  else if (k === "o" && S.peek) openHerdr(S.peek);
  else if (k === "c") toast("New card (mock)", "tiller card add <project> \"title\", then one line into that orchestrator's pane");
  else if (/^[1-7]$/.test(k)) goScreen(SCREENS[+k - 1].id);
});

/* in-place editing of memory lines */
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && t.matches && t.matches(".de-t[contenteditable]")) {
    if (e.key === "Enter") { e.preventDefault(); t.blur(); }
    else if (e.key === "Escape") { const en = entryById(t.dataset.eid); t.textContent = en.text; t.blur(); }
    e.stopPropagation();
  }
}, true);
document.addEventListener("focusout", e => { const t = e.target; if (t && t.matches && t.matches(".de-t[contenteditable]")) commitEntry(t); });

/* live tick: freshness counters */
setInterval(() => {
  $$(".obs[data-tick]").forEach(el => { let s = +el.dataset.s + 1; if (s > 58) s = 2; el.dataset.s = s; el.textContent = (el.dataset.pre ? el.dataset.pre + " " : "") + fmtAgo(s) + " ago"; });
}, 1000);
let lastW = 0;
new ResizeObserver(() => { if (S.route === "health") { const w = $("#stage").clientWidth; if (w !== lastW) { lastW = w; drawCharts(); } } }).observe($("#stage"));

/* ============ BOOT ============ */
$("#screens").innerHTML = SCREENS.map((s, n) => `<button type="button" role="tab" data-screen="${s.id}" aria-selected="false"><span class="n">${n + 1}</span>${esc(s.short || s.label)}</button>`).join("");
try { const th = localStorage.getItem("tiller-mock-theme"); if (th) setTheme(th); const de = localStorage.getItem("tiller-mock-density"); if (de) setDensity(de); } catch (_) {}
const startId = (location.hash || "").replace("#", "").replace(/^(focus|score)$/, m => ALIASES[m]);
const start = SCREENS.find(s => s.id === startId);
if (start) start.set();
render();
window.addEventListener("hashchange", () => { const id = (location.hash.replace("#", "")).replace(/^(focus|score)$/, m => ALIASES[m]); if (SCREENS.some(s => s.id === id) && id !== activeScreen()) goScreen(id); });
matchMedia("(max-width:820px)").addEventListener("change", () => render());
window.tiller = { S, goScreen, setTheme, setDensity, render };
})();
</script>
</body>
