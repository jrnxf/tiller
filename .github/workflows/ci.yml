name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Every commit on main keeps its own run, so each one gets a verdict. A newer
# push to any other ref still cancels the older run for that ref.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Caches. The Nix store cache holds what the dev shell or the flake build
# fetches and builds besides this repo's own crates: the toolchain, the
# patched bun2nix, and for the flake build the crane dependency build.
# rust-cache holds cargo's registry and the dependency artifacts in target/,
# never the workspace crates. Each is saved only when no cache with its exact
# key exists, so a run that changes no lock file saves nothing new.

jobs:
  # What a pull request touches, so a job that cannot be affected skips. A
  # skipped job still reports. A push to main and a call from tag.yml run
  # every job. Docs outside docs/spec/ (whose authority.md a Rust test reads)
  # and the top-level Markdown files reach no build or test. The board is
  # never compiled into a Rust test: debug builds read board/dist at run
  # time, and CI builds no board/dist outside the flake build. The board
  # tests read crates/ and contract/, so only docs skip the board job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # The merge commit and its parents: the PR's change is the diff
          # from the first parent, the base branch.
          fetch-depth: 2
      - id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          # The files that reach a build or a test, and of those, the ones
          # that reach Rust.
          code=$({ grep -Ev '^docs/|^[^/]*\.md$' <<<"$files"; grep -E '^docs/spec/' <<<"$files"; } || true)
          rust=$(grep -Ev '^board/' <<<"$code" || true)
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"
          if [ -n "$rust" ]; then echo "rust=true"; else echo "rust=false"; fi >> "$GITHUB_OUTPUT"

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'nix/patches/**') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
      # rust-cache reads the toolchain from PATH, so the dev shell's cargo
      # and rustc go on it. Every step below still runs in the dev shell.
      - name: Dev shell
        run: nix develop -c bash -c 'dirname "$(command -v cargo)"' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: nix develop -c cargo fmt --all --check
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy with the recorder
        run: nix develop -c cargo clippy -p tiller-cli --all-targets --features record -- -D warnings
      - name: Test the recorder
        run: nix develop -c cargo nextest run -p tiller-cli --features record --test holder_record

  # `cargo nextest run --workspace`, in three parts that together run every
  # test once. The `wall-clock` group (.config/nextest.toml) runs one test at
  # a time with no other test beside it, so in one run each of its tests
  # stalled all the others. The main part runs every test outside the group.
  # The group runs in two parts of its own, on runners of their own: the
  # soak, its longest binary, and the rest of the group. The group's
  # overrides apply in each part.
  test:
    name: test (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main
            filter: not group(wall-clock)
          - part: soak
            filter: group(wall-clock) & binary_id(tiller-cli::soak)
          - part: wall-clock
            filter: group(wall-clock) & not binary_id(tiller-cli::soak)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'nix/patches/**') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
      - name: Dev shell
        run: nix develop -c bash -c 'dirname "$(command -v cargo)"' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the tests
        run: nix develop -c cargo nextest run --workspace --no-run
      - name: Test
        run: nix develop -c cargo nextest run --workspace -E '${{ matrix.filter }}'

  board:
    name: board
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'nix/patches/**') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
      - name: Dev shell
        run: nix develop -c true
      - name: Install
        run: nix develop -c bun install --cwd board --frozen-lockfile
      - name: Lint
        run: nix develop -c bun run --cwd board lint
      - name: Format
        run: nix develop -c bun run --cwd board format:check
      - name: Typecheck
        run: nix develop -c bun run --cwd board typecheck
      - name: Unused code
        run: nix develop -c bun run --cwd board knip
      - name: Test
        run: nix develop -c bun run --cwd board test

  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No private names, paths or hosts
        run: scripts/scrub-check.sh

  evals:
    name: evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Offline: cases, fixtures and the judge lock. The evals themselves run
      # on demand in evals.yml.
      - name: Eval suite checks
        run: evals/check.sh

  nix:
    name: nix
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # The key covers every input of the crane dependency build, so a new
      # cache is saved only when a manifest or a lock file changes.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'nix/patches/**', '**/Cargo.toml', 'Cargo.lock', 'board/bun.lock', 'board/bun.nix') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
      # clippy, fmt, nextest and the board checks run in the rust, test and
      # board jobs.
      - name: Generated bun.nix is fresh
        run: nix build --print-build-logs .#checks.x86_64-linux.bunNixFresh
      - name: Vendored alacritty_terminal is the crate plus its patch
        run: nix build --print-build-logs .#checks.x86_64-linux.alacrittyPatchFresh
      # Evaluation alone catches a package the locked nixpkgs does not offer
      # on one listed system, so nothing for the other systems is built.
      - name: Every output of every listed system evaluates
        run: nix flake check --no-build --all-systems
      - name: Build
        run: nix build --print-build-logs
      - name: Smoke test
        run: scripts/smoke.sh result/bin/tiller

  # The owner's Mac builds the same flake: a Linux-only API (pipe2 and the
  # like) must fail here, not at a switch. The flake build runs in this job,
  # and clippy and the holder tests run beside it in macos-rust.
  macos:
    name: macos
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'nix/patches/**', '**/Cargo.toml', 'Cargo.lock', 'board/bun.lock', 'board/bun.nix') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
      - name: Build
        run: nix build --print-build-logs
      - name: Smoke test
        run: scripts/smoke.sh result/bin/tiller

  macos-rust:
    name: macos-rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', 'nix/patches/**') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
      - name: Dev shell
        run: nix develop -c bash -c 'dirname "$(command -v cargo)"' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Test the holder
        run: nix develop -c cargo nextest run -p tiller-holder
