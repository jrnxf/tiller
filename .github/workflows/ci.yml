name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Format
        run: nix develop -c cargo fmt --all --check
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo nextest run --workspace

  board:
    name: board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Install
        run: nix develop -c bun install --cwd board --frozen-lockfile
      - name: Lint
        run: nix develop -c bun run --cwd board lint
      - name: Format
        run: nix develop -c bun run --cwd board format:check
      - name: Typecheck
        run: nix develop -c bun run --cwd board typecheck
      - name: Unused code
        run: nix develop -c bun run --cwd board knip
      - name: Test
        run: nix develop -c bun run --cwd board test

  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No private names, paths or hosts
        run: scripts/scrub-check.sh

  evals:
    name: evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Offline: cases, fixtures and the judge lock. The evals themselves run
      # on demand in evals.yml.
      - name: Eval suite checks
        run: evals/check.sh

  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # clippy, fmt, nextest and the board checks run in the rust and board jobs.
      - name: Generated bun.nix is fresh
        run: nix build --print-build-logs .#checks.x86_64-linux.bunNixFresh
      - name: Build
        run: nix build --print-build-logs
      - name: Smoke test
        run: scripts/smoke.sh result/bin/tiller
