<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board demo</title>
<script>
  // Set the theme before any CSS paints so there is no flash.
  try {
    var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #fbfbfc; --panel: #ffffff; --side: #f4f5f7; --line: #e6e8ec; --line-soft: #eef0f3;
    --text: #1b1d21; --muted: #6b7280; --faint: #9aa0aa; --hover: #f1f2f5; --accent: #5e6ad2;
    --green: #2f9e63; --amber: #c58a12; --red: #d4493e; --blue: #3b82c4; --grey: #9aa0aa;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1012; --panel: #17181b; --side: #121316; --line: #26282d; --line-soft: #1e2024;
      --text: #e8e9ec; --muted: #9096a2; --faint: #666c78; --hover: #1d1f23; --accent: #8a93ee;
      --green: #4cc38a; --amber: #e0a93a; --red: #f06b5f; --blue: #6aaee8; --grey: #666c78;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1012; --panel: #17181b; --side: #121316; --line: #26282d; --line-soft: #1e2024;
    --text: #e8e9ec; --muted: #9096a2; --faint: #666c78; --hover: #1d1f23; --accent: #8a93ee;
    --green: #4cc38a; --amber: #e0a93a; --red: #f06b5f; --blue: #6aaee8; --grey: #666c78;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 224px 1fr; -webkit-font-smoothing: antialiased;
  }
  aside {
    background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px;
    display: flex; flex-direction: column; gap: 18px; overflow-y: auto; min-width: 0;
  }
  .brand { font-weight: 600; padding: 0 8px; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .sec { display: flex; flex-direction: column; gap: 1px; }
  .sec h4 { margin: 0 8px 4px; font-size: 11px; font-weight: 500; color: var(--faint); letter-spacing: .02em; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px;
    color: var(--text); border: 0; background: none; font: inherit; text-align: left; width: 100%; cursor: default;
  }
  button.row { cursor: pointer; }
  button.row:hover { background: var(--hover); }
  .row.on { background: var(--hover); }
  .row .n { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--grey); flex: none; }
  .dot.green { background: var(--green); } .dot.amber { background: var(--amber); }
  .dot.red { background: var(--red); } .dot.blue { background: var(--blue); }
  .tag { font-size: 11px; color: var(--faint); margin-left: auto; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 4px 10px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--hover); color: var(--text); }
  .status { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .scroll { overflow: auto; padding: 16px 20px 28px; flex: 1; }
  .cols, .lane-head { display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)); gap: 12px; }
  .cols-head { position: sticky; top: -16px; background: var(--bg); padding: 0 0 6px; z-index: 2; }
  .cols-head div { color: var(--muted); font-size: 12px; padding: 0 4px; display: flex; gap: 6px; align-items: center; }
  .lane { margin-top: 14px; }
  .lane-title { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-weight: 600; }
  .lane-title span { color: var(--faint); font-weight: 400; }
  .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .col .empty { color: var(--faint); padding: 6px 4px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .card .top { display: flex; gap: 6px; align-items: center; color: var(--faint); font-size: 11.5px; }
  .card .title { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
  .card .acts { display: flex; gap: 8px; margin-top: 2px; }
  .card a, .link {
    color: var(--accent); text-decoration: none; font-size: 11.5px; background: none; border: 0; padding: 0;
    font-family: inherit; cursor: pointer;
  }
  .card a:hover, .link:hover { text-decoration: underline; }
  .more { color: var(--faint); font-size: 11.5px; padding: 2px 4px; }
  .host { margin-bottom: 20px; }
  .host h2 { font-size: 13px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  .host h2 .stale { color: var(--amber); font-weight: 400; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  td { padding: 6px 10px; border-top: 1px solid var(--line-soft); vertical-align: middle; }
  tr:first-child td { border-top: 0; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
  td.r { text-align: right; white-space: nowrap; }
  .banner { margin: 0 0 14px; padding: 8px 12px; border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 6px; background: var(--panel); color: var(--muted); }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
    .cols, .lane-head { grid-template-columns: repeat(4, 220px); }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><i></i>Board demo</div>
  <div class="sec" id="projects"></div>
  <div class="sec" id="machines"></div>
</aside>
<main>
  <header>
    <h1 id="title">All projects</h1>
    <div class="seg" id="views"><button data-v="board" class="on">Board</button><button data-v="agents">Agents</button></div>
    <span class="sp"></span>
    <span class="status"><i class="dot" id="live"></i><span id="liveText">connecting</span></span>
    <div class="seg" id="themes"><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
  </header>
  <div class="scroll" id="root"></div>
</main>
<script>
const COLS = [
  ["needs", "Needs you", "red"],
  ["active", "Active", "blue"],
  ["queued", "Queued", "grey"],
  ["done", "Done", "green"],
];
const DONE_SHOWN = 4;
let data = null;
let view = "board";
let filterProject = null;
let toastTimer = 0;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const ago = (ms) => {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return s < 60 ? s + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : Math.round(s / 3600) + "h ago";
};
const statusColor = (s) => ({ working: "blue", blocked: "red", done: "green", idle: "grey" }[s] || "grey");

function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = el("div", { class: "toast" }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2500);
}

async function jump(paneId) {
  try {
    const r = await fetch("/api/focus", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ paneId }) });
    const j = await r.json();
    toast(j.ok ? "Focused " + paneId + " in herdr" : "Could not focus: " + (j.error || r.status));
  } catch (e) {
    toast("Could not focus: " + e.message);
  }
}

function localPaneIds() {
  const h = data.hosts.find((x) => x.local);
  return new Set(h ? h.panes.map((p) => p.paneId) : []);
}

function taskCard(t, local) {
  const canJump = t.paneId && local.has(t.paneId);
  return el("div", { class: "card" },
    el("div", { class: "top" }, t.id, t.kind && " · " + t.kind, t.since && " · " + t.since),
    el("div", { class: "title" }, t.title),
    (t.state || t.detail) && el("div", { class: "meta" }, [t.state, t.detail].filter(Boolean).join(" · ")),
    (t.prUrl || canJump) && el("div", { class: "acts" },
      t.prUrl && el("a", { href: t.prUrl, target: "_blank", rel: "noreferrer" }, "PR"),
      canJump && el("button", { class: "link", onclick: () => jump(t.paneId) }, "Jump to pane")));
}

function renderSide() {
  const tasks = data.fleet.tasks;
  const projects = [...new Set(tasks.map((t) => t.project))].sort();
  const box = document.getElementById("projects");
  box.replaceChildren(el("h4", {}, "Projects"),
    el("button", { class: "row" + (filterProject === null ? " on" : ""), onclick: () => { filterProject = null; render(); } }, "All projects", el("span", { class: "n" }, tasks.length)),
    ...projects.map((p) => {
      const open = tasks.filter((t) => t.project === p && t.column !== "done").length;
      return el("button", { class: "row" + (filterProject === p ? " on" : ""), onclick: () => { filterProject = p; render(); } }, p, el("span", { class: "n" }, open || ""));
    }));
  const m = document.getElementById("machines");
  m.replaceChildren(el("h4", {}, "Machines"), ...data.hosts.map((h) => {
    const running = h.panes.filter((p) => p.status === "working").length;
    return el("div", { class: "row", title: h.error || "" },
      el("i", { class: "dot " + (h.ok ? "green" : "amber") }), h.local ? "this machine" : h.name,
      el("span", { class: "tag" }, h.ok ? running + " running" : "last seen " + (h.updatedAt ? ago(h.updatedAt) : "never")),
      !h.local && !h.ok ? null : null);
  }));
  if (data.hosts.length === 1) m.append(el("div", { class: "row" }, el("span", { class: "tag", style: "margin-left:8px" }, "No saved remote machine")));
}

function renderBoard(root) {
  const all = data.fleet.tasks;
  const local = localPaneIds();
  const projects = [...new Set(all.map((t) => t.project))].sort();
  const shown = filterProject ? [filterProject] : projects;
  if (!data.fleet.ok) root.append(el("div", { class: "banner" }, "Fleet snapshot unavailable, showing the last good data. ", data.fleet.error || ""));
  const head = el("div", { class: "cols cols-head" }, ...COLS.map(([k, label, c]) => el("div", {}, el("i", { class: "dot " + c }), label)));
  root.append(head);
  for (const p of shown) {
    const mine = all.filter((t) => t.project === p);
    const open = mine.filter((t) => t.column !== "done").length;
    root.append(el("section", { class: "lane" },
      el("h3", { class: "lane-title" }, p, el("span", {}, open + " open")),
      el("div", { class: "cols" }, ...COLS.map(([k]) => {
        let items = mine.filter((t) => t.column === k);
        const hidden = k === "done" ? Math.max(0, items.length - DONE_SHOWN) : 0;
        if (hidden) items = items.slice(0, DONE_SHOWN);
        return el("div", { class: "col" },
          items.length ? items.map((t) => taskCard(t, local)) : el("div", { class: "empty" }, "-"),
          hidden ? el("div", { class: "more" }, "+" + hidden + " more done") : null);
      }))));
  }
}

function renderAgents(root) {
  for (const h of data.hosts) {
    const groups = new Map();
    for (const p of h.panes) (groups.get(p.workspaceId) || groups.set(p.workspaceId, []).get(p.workspaceId)).push(p);
    root.append(el("div", { class: "host" },
      el("h2", {}, h.local ? "This machine" : h.name,
        !h.ok && el("span", { class: "stale" }, "stale, last seen " + (h.updatedAt ? ago(h.updatedAt) : "never")),
        !h.local && el("span", { class: "tag" }, "view only")),
      h.panes.length === 0 ? el("div", { class: "empty" }, "No panes") :
        el("table", {}, ...[...groups.values()].flatMap((ps) => ps.map((p, i) => el("tr", {},
          el("td", {}, el("i", { class: "dot " + statusColor(p.status) })),
          el("td", {}, i === 0 ? p.workspace : ""),
          el("td", {}, p.agent || "shell"),
          el("td", {}, p.status),
          el("td", { class: "mono" }, p.title),
          el("td", { class: "r" }, h.local && el("button", { class: "link", onclick: () => jump(p.paneId) }, "Jump to pane"))))))));
  }
}

function render() {
  if (!data) return;
  document.getElementById("title").textContent = filterProject || "All projects";
  renderSide();
  const root = document.getElementById("root");
  const y = root.scrollTop;
  root.replaceChildren();
  (view === "board" ? renderBoard : renderAgents)(root);
  root.scrollTop = y;
  for (const b of document.querySelectorAll("#views button")) b.classList.toggle("on", b.dataset.v === view);
  const stale = !data.fleet.ok || data.hosts.some((h) => !h.ok);
  document.getElementById("live").className = "dot " + (stale ? "amber" : "green");
  document.getElementById("liveText").textContent = stale ? "partial data" : "live";
}

document.getElementById("views").addEventListener("click", (e) => { const v = e.target.dataset && e.target.dataset.v; if (v) { view = v; render(); } });
document.getElementById("themes").addEventListener("click", (e) => {
  const t = e.target.dataset && e.target.dataset.t;
  if (!t) return;
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (err) {}
});

function connect() {
  const es = new EventSource("/events");
  es.addEventListener("state", (e) => { data = JSON.parse(e.data); render(); });
  es.onerror = () => {
    document.getElementById("live").className = "dot red";
    document.getElementById("liveText").textContent = "reconnecting";
  };
}
connect();
</script>
</body>
</html>
