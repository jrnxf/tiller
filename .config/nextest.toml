# The hook latency check (T2.6) measures wall-clock time, so it runs with no
# other test beside it.
[[profile.default.overrides]]
filter = 'binary(hook) & test(hook_is_inside_the_ten_ms_budget_with_the_daemon_down)'
threads-required = "num-test-threads"

# The startup check (T2.2) gates the 10 ms budget on the command's own CPU
# time, and keeps a wall-clock ceiling that only a wait reaches. It still runs
# alone, so its neighbours do not share the cores it measures: on a two-core
# runner one of them took a whole core. The test checks that it is in the
# `wall-clock` group, so a rename that drops it from this filter fails loudly
# instead of running it in parallel again.
[test-groups]
wall-clock = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(startup) & test(startup_is_under_ten_milliseconds)'
test-group = "wall-clock"
threads-required = "num-test-threads"

# The holder flood check (section 9.4) gates 200 MiB on a 10 s wall-clock
# budget and every ping on 50 ms. With neighbours on the cores, a CI run took
# 10.8 s, so it runs alone too. It checks its group the same way.
[[profile.default.overrides]]
filter = 'binary(holder) & test(a_flood_keeps_the_holders_memory_bound_and_every_ping_fast)'
test-group = "wall-clock"
threads-required = "num-test-threads"

# The soak (H14a) restarts a daemon and a holder on a timer and reads counters
# on a schedule, so it runs alone too. Each of its tests checks its group.
[[profile.default.overrides]]
filter = 'binary(soak)'
test-group = "wall-clock"
threads-required = "num-test-threads"

# Four agent checks race the wall clock: the counter's ticks are gated on
# a stall under a second, the kill before Enter lands inside the
# half-second settle, the output-quiet guard paces a recording's frames,
# and a pane that never stops printing paces its output on the clock.
# They run alone and check their group the same way.
[[profile.default.overrides]]
filter = 'binary(holder_agents) & (test(twenty_daemon_restarts_leave_no_gap_in_a_counter) | test(a_daemon_killed_between_a_typed_line_and_its_enter_submits_it_once) | test(a_message_waits_out_a_reply_that_streams_with_an_empty_composer) | test(a_message_waits_for_a_pane_that_never_stops_printing))'
test-group = "wall-clock"
threads-required = "num-test-threads"
