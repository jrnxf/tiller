[package]
name = "tiller-herdr"
description = "herdr socket and CLI adapter, pollers and layout rules (T2.5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The fake herdr server and the test fleet, for other crates' tests.
testing = ["dep:tempfile", "tiller-panes/testing"]

[dependencies]
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tiller-core.workspace = true
tiller-panes.workspace = true
tiller-poll.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
insta.workspace = true
tiller-panes = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
