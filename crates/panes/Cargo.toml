[package]
name = "tiller-panes"
description = "The terminal holder's protocol, framing and client, and the Panes trait (terminal-holder.md 2.4, 4.1, 4.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The in-memory `FakePanes` and the test fleet, for other crates' tests.
testing = ["dep:tempfile", "dep:tiller-core", "rustix/pty", "rustix/termios"]

# A stand-in for Claude Code, for end-to-end tests of holder panes.
[[bin]]
name = "fake-agent"
path = "src/bin/fake-agent.rs"
required-features = ["testing"]
test = false

[dependencies]
jiff.workspace = true
rustix = { workspace = true, features = ["event", "net", "process"] }
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tiller-core = { workspace = true, optional = true }
tokio.workspace = true
ulid.workspace = true

[dev-dependencies]
proptest.workspace = true
rustix = { workspace = true, features = ["pty"] }
tempfile.workspace = true
tiller-core.workspace = true

[lints]
workspace = true
