[workspace]
resolver = "3"
members = [
    "crates/agents",
    "crates/cli",
    "crates/core",
    "crates/daemon",
    "crates/delivery",
    "crates/holder",
    "crates/observe",
    "crates/panes",
    "crates/poll",
    "crates/reconcile",
    "crates/replay",
]
# The patched alacritty_terminal is a dependency, not a member: its own
# tests and lints are upstream's.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/jrnxf/tiller"

# Every known dependency is pinned here (build plan, "Stack"), so parallel lanes
# add `foo.workspace = true` to their own crate and never edit this file.
[workspace.dependencies]
# Workspace crates
tiller-agents = { path = "crates/agents" }
tiller-core = { path = "crates/core" }
tiller-daemon = { path = "crates/daemon" }
tiller-delivery = { path = "crates/delivery" }
tiller-holder = { path = "crates/holder" }
tiller-observe = { path = "crates/observe" }
tiller-panes = { path = "crates/panes" }
tiller-poll = { path = "crates/poll" }
tiller-reconcile = { path = "crates/reconcile" }
tiller-replay = { path = "crates/replay" }

# Runtime
# The holder's screen model; a bump is its own task (terminal-holder.md 3.1).
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "3"
getrandom = "0.4"
jiff = { version = "0.2.38", features = ["serde"] }
libc = "0.2"
notify = "8"
qrcode = { version = "0.14", default-features = false }
regex = "1"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
rusqlite_migration = "2.6"
rust-embed = { version = "8", features = ["mime-guess"] }
rustix = { version = "1", features = ["fs", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
signal-hook = { version = "0.4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
utoipa = { version = "6", features = ["axum_extras"] }

# Tests
insta = { version = "1", features = ["json"] }
nix = { version = "0.30", default-features = false, features = ["process", "resource", "sched", "signal"] }
proptest = "1"
rsa = "0.9"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# alacritty_terminal 0.26.0 plus getters and setters the holder's live
# upgrade needs (vendor/README.md). The patch is nix/patches/alacritty_terminal-0.26.0-handover.patch.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# The bundled SQLite at -O0 makes `tiller hook` miss its 10 ms budget in
# debug builds, the ones tests run (T2.6).
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Tests generate throwaway RSA keys for the merge App; unoptimized bignum
# arithmetic makes each one take seconds.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# The holder parses every byte a pane writes, through generic code that is
# built in the holder crate. At -O0 it takes a flood at a third of the
# rate the fault tests ask for (terminal-holder.md 9.4).
[profile.dev.package.tiller-holder]
opt-level = 2

[profile.dev.package.alacritty_terminal]
opt-level = 2

[profile.dev.package.vte]
opt-level = 2
